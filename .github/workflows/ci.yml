  check-windows-cli-lib:
    needs: scope
    if: needs.scope.outputs.full_ci == 'true' || needs.scope.outputs.windows_cli_lib_commands != '[]'
    # Same-repo PRs run on the repo-owned Windows pool when OCTOS_CI_WINDOWS
    # is 'true', and there they run the full Windows suite (hosted PR runs
    # only check and a few probes, so Windows-only failures used to surface
    # first in the merge group). Merge groups, main and forks stay hosted.
    runs-on: ${{ vars.OCTOS_CI_WINDOWS == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","windows","x64","octos-ci-win"]') || 'windows-latest' }}
    env:
      RUST_MIN_STACK: "8388608"
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # The repo-owned pool keeps Rust preinstalled and a target directory per
      # slot between jobs, so it skips the toolchain install and rust-cache.
      - name: Select preinstalled Rust toolchain (self-hosted)
        if: runner.environment == 'self-hosted' && needs.scope.outputs.main_dedup != 'true'
        run: Add-Content $env:GITHUB_ENV "RUSTUP_TOOLCHAIN=$env:RUST_VERSION"

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        if: runner.environment == 'github-hosted'
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Restore pre-split Windows cache (migration)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: windows
          save-if: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: windows-cli-lib
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # One command per step, on purpose. Windows steps run under pwsh, which
      # does NOT abort on a failing native command — GitHub appends only
      # `exit $LASTEXITCODE`, so a multi-line `run:` block reports the exit
      # code of its LAST line and silently swallows every failure before it.
      # The Linux jobs above are safe (bash runs with `-eo pipefail`); these
      # two blocks were the only multi-command steps in this job.
      - name: Compile Windows CLI cache (dedup main)
        if: needs.scope.outputs.main_dedup == 'true'
        run: cargo build -p octos-cli --features ${{ env.FEATURES }}

      # One command per step, on purpose. Windows steps run under pwsh, which
      # does NOT abort on a failing native command — GitHub appends only
      # `exit $LASTEXITCODE`, so a multi-line `run:` block reports the exit
      # code of its LAST line and silently swallows every failure before it.
      # The Linux jobs above are safe (bash runs with `-eo pipefail`); these
      # two blocks were the only multi-command steps in this job.
      - name: Check octos-cli + all features (PR)
        if: (github.event_name == 'pull_request' && runner.environment == 'github-hosted') && needs.scope.outputs.main_dedup != 'true'
        run: cargo check -p octos-cli --features ${{ env.FEATURES }}

      - name: Build octos-cli + all features (main/manual)
        if: (github.event_name != 'pull_request' || runner.environment == 'self-hosted') && needs.scope.outputs.main_dedup != 'true'
        run: cargo build -p octos-cli --features ${{ env.FEATURES }}

      # A changed test/module must run on the PR even when crate selection is
      # selective. List first and reject an empty filter: a renamed/deleted
      # module must never turn this coverage into a green zero-test step.
      - name: Test changed octos-cli modules (PR)
        if: (github.event_name == 'pull_request' && runner.environment == 'github-hosted' && needs.scope.outputs.windows_cli_lib_commands != '[]') && needs.scope.outputs.main_dedup != 'true'
        env:
          WINDOWS_TEST_COMMANDS: ${{ needs.scope.outputs.windows_cli_lib_commands }}
        run: >-
          $commands = $env:WINDOWS_TEST_COMMANDS | ConvertFrom-Json -NoEnumerate; foreach ($command in $commands) { $listed = & cargo @command -- --list; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; $count = @($listed | Select-String ': test$').Count; Write-Host "Windows selected test list: $count tests for $($command -join ' ')"; if ($count -lt 1) { Write-Error "changed test filter selected zero tests"; exit 1 }; & cargo @command; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }

      # The workspace-media nofollow guard has real reparse-point behavior
      # that a compile-only Windows lane cannot cover. Keep this focused suite
      # on PRs so parent junctions and leaf replacements must actually execute.
      - name: Test octos-cli (lib)
        if: ${{ ((github.event_name != 'pull_request' || runner.environment == 'self-hosted') && !cancelled()) && needs.scope.outputs.main_dedup != 'true' }}
        run: cargo test -p octos-cli --lib


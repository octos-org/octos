    runs-on: ${{ vars.OCTOS_CI_WINDOWS == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","windows","x64","octos-ci-win"]') || 'windows-latest' }}

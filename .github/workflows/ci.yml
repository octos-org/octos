      - name: Test octos-core (PR)
        if: (github.event_name == 'pull_request' && runner.environment == 'github-hosted') && needs.scope.outputs.main_dedup != 'true'
        run: cargo test -p octos-core

      # Direct dependents stay in the existing Linux selector; this additional
      # Windows command set comes only from the PR's own changed test/modules.
      # If a module legitimately has zero tests on this host (e.g. all retained
      # cases are Unix-only), remove only the trailing lib test filter, or the
      # `--test`/`--bin` selector plus its target name, preserving every other
      # feature/compile flag. A zero-test whole-crate fallback still fails closed.
      - name: Test changed workspace modules (PR)
        if: (github.event_name == 'pull_request' && runner.environment == 'github-hosted' && needs.scope.outputs.windows_workspace_commands != '[]') && needs.scope.outputs.main_dedup != 'true'
        env:
          WINDOWS_TEST_COMMANDS: ${{ needs.scope.outputs.windows_workspace_commands }}
        run: >-
          $commands = $env:WINDOWS_TEST_COMMANDS | ConvertFrom-Json -NoEnumerate; foreach ($command in $commands) { $listed = & cargo @command -- --list; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; $count = @($listed | Select-String ': test$').Count; Write-Host "Windows selected test list: $count tests for $($command -join ' ')"; if ($count -lt 1) { if ($command -contains '--test' -or $command -contains '--bin') { $command = @($command | Select-Object -SkipLast 2) } else { $command = @($command | Select-Object -SkipLast 1) }; Write-Host "Module or target has zero tests on this host; falling back to the full crate suite with the original feature/compile flags"; $listed = & cargo @command -- --list; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; $count = @($listed | Select-String ': test$').Count }; if ($count -lt 1) { Write-Error "changed workspace test filter selected zero tests, including the full-crate fallback"; exit 1 }; & cargo @command; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }

      # Sharded per-crate tests — same rationale as the `check` job.
      #
      # Every test step runs even after an earlier one fails. GitHub aborts a
      # job at the first failing step, so a single red crate hid every crate
      # after it — PR #1860 fixed ~48 Windows failures and the job STILL only
      # reported one, with steps 18-20 never executing. That turned Windows
      # into a one-failure-per-40-minute-run guessing game.
      #
      # `!cancelled()` keeps the step running on failure but NOT after a manual
      # cancel or job timeout. The job's own conclusion is unchanged: any red
      # step still fails the job, so this weakens no gate — it only makes one
      # run report the whole truth.
      - name: Test octos-core
        if: ${{ ((github.event_name != 'pull_request' || runner.environment == 'self-hosted') && !cancelled()) && needs.scope.outputs.main_dedup != 'true' }}
        run: cargo test -p octos-core
      - name: Test octos-memory
        if: ${{ ((github.event_name != 'pull_request' || runner.environment == 'self-hosted') && !cancelled()) && needs.scope.outputs.main_dedup != 'true' }}
        run: cargo test -p octos-memory
      - name: Test octos-llm (lib)
        if: ${{ ((github.event_name != 'pull_request' || runner.environment == 'self-hosted') && !cancelled()) && needs.scope.outputs.main_dedup != 'true' }}
        run: cargo test -p octos-llm --lib
      - name: Test octos-llm (integration)
        if: ${{ ((github.event_name != 'pull_request' || runner.environment == 'self-hosted') && !cancelled()) && needs.scope.outputs.main_dedup != 'true' }}
        # Keep the lib suite in its own step; select integration targets only.
        # TEST-DIET may leave no integration targets; the shared glob helper
        # prints a skip line instead of letting the empty wildcard error out.
        run: bash scripts/cargo-test-glob.sh octos-llm
      - name: Test octos-bus
        if: ${{ ((github.event_name != 'pull_request' || runner.environment == 'self-hosted') && !cancelled()) && needs.scope.outputs.main_dedup != 'true' }}
        run: cargo test -p octos-bus
      - name: Test octos-plugin
        if: ${{ ((github.event_name != 'pull_request' || runner.environment == 'self-hosted') && !cancelled()) && needs.scope.outputs.main_dedup != 'true' }}
        run: cargo test -p octos-plugin
      - name: Test octos-sandbox
        if: ${{ ((github.event_name != 'pull_request' || runner.environment == 'self-hosted') && !cancelled()) && needs.scope.outputs.main_dedup != 'true' }}
        run: cargo test -p octos-sandbox
      - name: Test octos-swarm
        if: ${{ ((github.event_name != 'pull_request' || runner.environment == 'self-hosted') && !cancelled()) && needs.scope.outputs.main_dedup != 'true' }}
        run: cargo test -p octos-swarm
      - name: Test octos-agent (lib)
        if: ${{ ((github.event_name != 'pull_request' || runner.environment == 'self-hosted') && !cancelled()) && needs.scope.outputs.main_dedup != 'true' }}
        run: cargo test -p octos-agent --lib
      - name: Test octos-agent (integration)
        if: ${{ (github.event_name != 'pull_request' && runner.environment == 'github-hosted' && !cancelled()) && needs.scope.outputs.main_dedup != 'true' }}
        # Keep the lib suite in its own step; select integration targets only.
        run: bash scripts/cargo-test-glob.sh octos-agent
      # The repo-owned pool has no Docker daemon for the CI account, and
      # should_block_dangerous_docker_cwd needs one (Nightly Windows ARM skips
      # it for the same reason). Hosted merge groups still run it.
      - name: Test octos-agent (integration, self-hosted)
        if: ${{ (runner.environment == 'self-hosted' && !cancelled()) && needs.scope.outputs.main_dedup != 'true' }}
        run: bash scripts/cargo-test-glob.sh octos-agent -- --skip should_block_dangerous_docker_cwd
      - name: Test harness starter generic
        if: ${{ ((github.event_name != 'pull_request' || runner.environment == 'self-hosted') && !cancelled()) && needs.scope.outputs.main_dedup != 'true' }}
        run: cargo test -p harness-starter-generic

      - name: Test harness starter report
        if: ${{ ((github.event_name != 'pull_request' || runner.environment == 'self-hosted') && !cancelled()) && needs.scope.outputs.main_dedup != 'true' }}
        run: cargo test -p harness-starter-report

      - name: Test harness starter audio
        if: ${{ ((github.event_name != 'pull_request' || runner.environment == 'self-hosted') && !cancelled()) && needs.scope.outputs.main_dedup != 'true' }}
        run: cargo test -p harness-starter-audio

      - name: Test harness starter coding
        if: ${{ ((github.event_name != 'pull_request' || runner.environment == 'self-hosted') && !cancelled()) && needs.scope.outputs.main_dedup != 'true' }}
        run: cargo test -p harness-starter-coding


  check-windows:
    # Required stable name: this aggregate replaces the former monolithic job.
    # All three shards run the exact test commands that used to live here.
    needs: [check-windows-cli-lib, check-windows-cli-integration, check-windows-workspace]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every Windows shard
        shell: bash
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq .
          for shard in check-windows-cli-lib check-windows-cli-integration check-windows-workspace; do
            result=$(echo "$RESULTS" | jq -r --arg shard "$shard" '.[$shard].result')
            case "$result" in
              # Skipped shards retain the old full_ci=false selective-PR behavior.
              success|skipped) ;;
              failure|cancelled)
                echo "::error::$shard finished with $result"
                exit 1
                ;;
              *)
                echo "::error::$shard has unexpected result $result"
                exit 1
                ;;
            esac
          done

  check-darwin:
    needs: scope
    if: needs.scope.outputs.full_ci == 'true'
    # Runs on PRs, like check-windows: the workspace has 89
    # `cfg(target_os = "macos")` sites that NEVER compile on the Linux runners
    # every other PR job uses, so a macOS-only break was invisible until after
    # merge — #2239 alone produced two such breaks (#2258's E0599 in the
    # default build, #2263's E0425 in api-feature test code) while every
    # required check stayed green. The existing macOS jobs do not close this:
    # e2e-tool-regression builds octos-cli (api+telegram features) but fires
    # only on e2e path changes, and the security suite compiles one
    # octos-agent test binary only on security-path changes — so an ordinary
    # PR gets no macOS compile signal at all.
    #
    # Compile-only, so the cost is one macos-15 runner for a cargo check, not
    # a test run. Both steps pass --all-targets so cfg(test) code is compiled
    # too — #2263's break lived in feature-gated test modules, which a
    # lib-only check would never see.
    # Trusted events (push, merge_group, workflow_dispatch) run on the
    # repo-owned macOS pool when vars.OCTOS_MAC_POOL == 'on'; pull_request
    # (incl. forks) always stays on hosted macos-15. See SELF_HOSTED_RUNNERS.txt.
    runs-on: ${{ github.event_name != 'pull_request' && vars.OCTOS_MAC_POOL == 'on' && fromJSON('["self-hosted","macOS","ARM64","octos-mac"]') || 'macos-15' }}
    timeout-minutes: 60
    env:
      # The repo-owned macOS pool wraps rustc in sccache; when the server
      # dies mid-build, sccache hard-fails every crate with
      # `Connection reset by peer` (build-macos-arm 126451389374,
      # e2e-tool-regression 126539518951). This documented variable makes
      # sccache fall back to local compilation instead of failing the build
      # (sccache README, "Usage"; present since sccache 0.4.0 / PR #1090).
      # Inert on hosted macos-15, which has no sccache wrapper.
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Reuse installed rustup on the self-hosted pool
        # The octos-mac pool keeps rustup under the runner-local
        # CARGO_HOME/bin (not on PATH); reusing it avoids a rustup-init
        # download per job. Falls back to one bounded-retry download.
        if: runner.environment == 'self-hosted'
        run: bash scripts/ci-ensure-rustup.sh

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        # Self-hosted runners keep target/ and use the shared sccache bucket.
        if: runner.environment == 'github-hosted'
        with:
          shared-key: darwin
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check workspace (all targets)
        run: cargo check --workspace --all-targets

      - name: Check octos-cli + all features (all targets)
        run: cargo check -p octos-cli --all-targets --features ${{ env.FEATURES }}

      # The updater's signature-preservation behavior (#2559) lives in
      # macOS-gated code, so the ubuntu `cargo test -p octos-services` lane
      # never executes it — coverage that prints nothing and looks like
      # passing coverage (#2055).
      - name: Test octos-services (macOS behavior)
        run: cargo test -p octos-services

      # O_SEARCH preserves traverse-only media directories on macOS. Run the
      # focused suite rather than assuming the Linux O_PATH result transfers.
      - name: Test octos-llm media nofollow fixtures (macOS behavior)
        run: cargo test -p octos-llm --lib vision::tests

  # ── Release artifact builds (main only) ──────────────────────────
  build-macos-arm:
    if: github.event_name == 'push'
    needs: [check, test-octos-agent, test-octos-cli]

name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
  workflow_dispatch:
    inputs:
      check_riscv:
        description: Run the experimental riscv check (requires an external runner)
        required: false
        default: false
        type: boolean

# Cancel a PR's in-flight run when it is superseded by a new push. Without this
# every amend queues another full matrix behind the old one. A newer run on the
# same ref contains every earlier commit, so it supersedes the older run.
# Release artifacts are built by release.yml, not this workflow.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PR updates cancel superseded runs. Main pushes and manual dispatches
  # preserve the running workflow, but retain the default single pending
  # slot: a third arrival can still replace the pending second run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  # Multi-pending main runs remain a follow-up. A static queue:max would
  # conflict with PR cancellation; the earlier queue:1 expression was also
  # invalid (the accepted values are single and max).

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.97.1"
  FEATURES: "api,telegram,discord,dingtalk,whatsapp,feishu,twilio,wecom,wecom-bot,audio_mp3"
  SKILL_CRATES: "-p news_fetch -p deep-search -p deep-crawl -p send-email -p account-manager -p voice -p clock -p weather -p office -p smart-home -p skill-evolve"

jobs:
  dashboard:
    needs: scope
    if: needs.scope.outputs.dashboard == 'true'
    runs-on: ${{ vars.OCTOS_CI_SELF_HOSTED == 'true' && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","octos-ci"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard deps
        working-directory: dashboard
        run: npm ci

      - name: Dashboard typecheck
        working-directory: dashboard
        run: npm run typecheck

      - name: Dashboard build
        working-directory: dashboard
        run: npm run build

      # Ephemeral bundle policy: crates/octos-cli/static/admin/ is gitignored
      # and rebuilt by scripts/build-dashboard.sh, CI release jobs, and any
      # source-clone build. We verify the build script runs cleanly; we do
      # not diff a committed bundle against rebuilt output (there is no
      # committed bundle by policy). See the note in .gitignore.
      - name: Verify dashboard build script runs cleanly
        run: ./scripts/build-dashboard.sh

      # providers.json is a DERIVED artifact: the dashboard model picker is
      # sourced from the canonical model_catalog.json via this append-only
      # generator. Run it and fail if the committed file drifted — e.g. a new
      # catalog model was added but never reflected into the picker.
      - name: Verify dashboard providers.json is in sync with the model catalog
        run: |
          # The generator exits nonzero on an unsupported parity case (a new
          # catalog family with no env mapping, a lingering web-only model, or a
          # read/write error) — propagate that instead of masking it. A clean run
          # that merely APPENDED catalog models exits zero, so the git-status
          # diff below is what catches ordinary drift.
          if ! python3 scripts/sync-dashboard-providers.py; then
            echo "sync-dashboard-providers.py reported a parity problem (see the WARNING lines above) — resolve it before merging."
            exit 1
          fi
          if [ -n "$(git status --porcelain -- dashboard/src/providers.json)" ]; then
            echo "dashboard/src/providers.json is out of date. Run scripts/sync-dashboard-providers.py and commit the result."
            git status --short -- dashboard/src/providers.json
            git --no-pager diff -- dashboard/src/providers.json
            exit 1
          fi

  swarm-app:
    needs: scope
    if: needs.scope.outputs.swarm_app == 'true'
    runs-on: ${{ vars.OCTOS_CI_SELF_HOSTED == 'true' && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","octos-ci"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: swarm-app/package-lock.json

      - name: Install swarm-app deps
        working-directory: swarm-app
        run: npm ci

      - name: Swarm-app typecheck
        working-directory: swarm-app
        run: npm run typecheck

      - name: Swarm-app build
        working-directory: swarm-app
        run: npm run build

      - name: Swarm-app unit tests
        working-directory: swarm-app
        run: npx vitest run

      - name: Verify embedded swarm-app assets are up to date
        run: |
          ./scripts/build-swarm-app.sh
          if [ -n "$(git status --porcelain -- crates/octos-cli/static/swarm)" ]; then
            echo "Embedded swarm-app assets are out of date. Run ./scripts/build-swarm-app.sh and commit changes."
            git status --short -- crates/octos-cli/static/swarm
            exit 1
          fi

  typos:
    runs-on: ${{ vars.OCTOS_CI_SELF_HOSTED == 'true' && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","octos-ci"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: crate-ci/typos@b1ae8d918b6e85bd611117d3d9a3be4f903ee5e4 # v1.33.1

  ux-gate-report:
    runs-on: ${{ vars.OCTOS_CI_SELF_HOSTED == 'true' && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","octos-ci"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Validate UX scenario manifest
        run: npm --prefix e2e run ux:scenario:list:test

      - name: Validate UX gate report generator
        run: npm --prefix e2e run ux:gate:report:test

      - name: Write local UX gate summary
        run: npm --prefix e2e run ux:gate:local -- --out-dir e2e/test-results-ux/ci-local

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ux-gate-local-summary
          path: e2e/test-results-ux/ci-local/ux-summary.*
          if-no-files-found: error
          retention-days: 7

  windows-deploy-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Windows deploy dry run
        shell: pwsh
        run: |
          $deploy = & .\scripts\deploy.ps1 `
            -HostName win.example.invalid `
            -User deploy `
            -Port 2222 `
            -Version v0.0.0-test `
            -RemoteRoot 'C:\octos-ci' `
            -ServiceName OctosServeTest `
            -ServePort 50080 `
            -AuthToken test-token `
            -DryRun 2>&1
          $deployText = $deploy | Out-String
          Write-Host $deployText
          if ($deployText -notmatch '\$nssmExe install') {
            throw 'deploy dry run did not include NSSM service registration'
          }
          if ($deployText -match '--auth-token') {
            throw 'deploy dry run must not pass the bearer token via service argv (#2380)'
          }
          if ($deployText -notmatch 'icacls \$tokenTmp /inheritance:r') {
            throw 'deploy dry run did not restrict the serve-token file ACLs (#2496)'
          }
          if ($deployText -notmatch 'set /p OCTOS_AUTH_TOKEN=<') {
            throw 'deploy dry run did not read the token from the serve-token file in the launcher (#2496)'
          }
          $envLines = $deployText -split "`r?`n" | Where-Object { $_ -match 'AppEnvironmentExtra' }
          if (-not $envLines) {
            throw 'deploy dry run lost the non-secret service environment'
          }
          if ($envLines -match 'OCTOS_AUTH_TOKEN=') {
            throw 'deploy dry run still delivers the token via AppEnvironmentExtra (#2496)'
          }
          if ($deployText -match 'auth_token = \$authToken') {
            throw 'deploy dry run still writes the token into config.json (#2496)'
          }
          if ($deployText -notmatch 'C:\\octos-ci') {
            throw 'deploy dry run did not include the requested remote root'
          }
          if ($deployText -notmatch 'ssh -p 2222') {
            throw 'deploy dry run did not include SSH port handling'
          }

          $uninstall = & .\scripts\deploy.ps1 `
            -HostName win.example.invalid `
            -RemoteRoot 'C:\octos-ci' `
            -ServiceName OctosServeTest `
            -Uninstall `
            -Purge `
            -DryRun 2>&1
          $uninstallText = $uninstall | Out-String
          Write-Host $uninstallText
          if ($uninstallText -notmatch 'sc\.exe delete') {
            throw 'uninstall dry run did not include sc.exe fallback'
          }
          if ($uninstallText -notmatch 'Remove-Item -Recurse -Force') {
            throw 'uninstall dry run did not include purge behavior'
          }

      - name: Test serve-launcher token handoff
        shell: pwsh
        run: |
          # Windows pwsh exits -Command with the last native command's exit
          # code; the script's refusal arm leaves it at 1 on a green run
          # (#2388). Dot-source, then make success explicit — a throw aborts
          # the body before the exit, so failures stay red.
          . ./scripts/tests/test-serve-launcher-token.ps1
          exit 0

      - name: Test installer bundle checksum verification
        shell: pwsh
        run: |
          # Same dot-source discipline as above (#2388).
          . ./scripts/tests/test-install-checksum.ps1
          exit 0

  web-app-base-url-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Test embedded web base URL
        shell: bash
        run: '"$BASH" scripts/tests/test-build-web-app-base-url.sh'

  bundle-release-check:
    runs-on: ${{ vars.OCTOS_CI_SELF_HOSTED == 'true' && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","octos-ci"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Test bundle checksum sidecar
        run: scripts/test-bundle-release.sh

      - name: Test portable skill resources and release build parity
        run: python3 scripts/tests/test-bundled-resource-skills.py

      - name: Test installer checksum verification
        run: |
          bash scripts/test-install-paths.sh
          pwsh scripts/tests/test-install-checksum.ps1

  # Selects changed Cargo packages plus their declared direct dependents for
  # ordinary PRs. Documentation-only PRs skip Rust jobs; lock/toolchain/CI,
  # reviewed cross-crate/platform paths and `full-ci` labels retain the full
  # matrix. merge_group and main always run the complete coverage backstop.
  # research_only/windows_neutral retain the existing research-path semantics.
  scope:
    runs-on: ${{ vars.OCTOS_CI_SELF_HOSTED == 'true' && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","octos-ci"]') || 'ubuntu-latest' }}
    outputs:
      research_only: ${{ steps.scope.outputs.research_only }}
      windows_neutral: ${{ steps.scope.outputs.windows_neutral }}
      full_ci: ${{ steps.scope.outputs.full_ci }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      selective: ${{ steps.scope.outputs.selective }}
      packages: ${{ steps.scope.outputs.packages }}
      light_packages: ${{ steps.scope.outputs.light_packages }}
      light_package_names: ${{ steps.scope.outputs.light_package_names }}
      agent_selected: ${{ steps.scope.outputs.agent_selected }}
      cli_selected: ${{ steps.scope.outputs.cli_selected }}
      research_selected: ${{ steps.scope.outputs.research_selected }}
      dashboard: ${{ steps.scope.outputs.dashboard }}
      swarm_app: ${{ steps.scope.outputs.swarm_app }}
      main_dedup: ${{ steps.scope.outputs.main_dedup }}
      windows_cli_lib_commands: ${{ steps.scope.outputs.windows_cli_lib_commands }}
      windows_cli_integration_commands: ${{ steps.scope.outputs.windows_cli_integration_commands }}
      windows_workspace_commands: ${{ steps.scope.outputs.windows_workspace_commands }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: scope
        run: |
          set -euo pipefail
          research_only=false
          windows_neutral=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            BASE="${{ github.event.merge_group.base_sha }}"
          else
            BASE=HEAD~1
          fi
          FILES=$(git diff --name-only "$BASE"...HEAD)
          echo "Changed files:"
          echo "$FILES"
          # Here-strings, not pipes: under pipefail an early `grep -q` exit
          # can SIGPIPE `echo`, and the negated failure would read as a match.
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "$FILES" ] && ! grep -qvE '^crates/(octos-research|app-skills/deep-search|app-skills/deep-crawl)/' <<<"$FILES"; then
            research_only=true
            if ! grep -qvE '^crates/octos-research/' <<<"$FILES"; then
              windows_neutral=true
            fi
          fi

          python3 scripts/ci-workspace-inventory.py --repo . --out /tmp/octos-ci-inventory.json
          python3 scripts/ci-select-scope.py --repo . --inventory /tmp/octos-ci-inventory.json \
            --base "$BASE" --out /tmp/octos-ci-selection.json

          full_ci=$(jq -r '.full_ci' /tmp/octos-ci-selection.json)
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            full_ci=true
          fi
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}" = "true" ]; then
            full_ci=true
          fi
          # Event/label overrides happen after path classification. Recompute
          # the package set too, or a merge_group touching one leaf crate would
          # silently run only that leaf instead of the complete backstop.
          if [ "$full_ci" = true ] && [ "$(jq -r '.full_ci' /tmp/octos-ci-selection.json)" != true ]; then
            python3 scripts/ci-select-scope.py --repo . --inventory /tmp/octos-ci-inventory.json \
              --base "$BASE" --out /tmp/octos-ci-selection.json --full-ci
          fi
          docs_only=$(jq -r '.docs_only' /tmp/octos-ci-selection.json)
          if [ "$full_ci" = true ]; then
            docs_only=false
            research_only=false
            windows_neutral=false
          fi
          selective=false
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "$full_ci" = false ] && [ "$docs_only" = false ]; then
            selective=true
          fi

          packages=$(jq -r '.selected_packages | map("-p " + .) | join(" ")' /tmp/octos-ci-selection.json)
          light_packages=$(jq -r '.selected_packages | map(select(. != "octos-agent" and . != "octos-cli") | "-p " + .) | join(" ")' /tmp/octos-ci-selection.json)
          light_package_names=$(jq -r '.selected_packages | map(select(. != "octos-agent" and . != "octos-cli")) | join(" ")' /tmp/octos-ci-selection.json)
          agent_selected=$(jq -r '.selected_packages | any(. == "octos-agent")' /tmp/octos-ci-selection.json)
          cli_selected=$(jq -r '.selected_packages | any(. == "octos-cli")' /tmp/octos-ci-selection.json)
          research_selected=$(jq -r '.selected_packages | any(. == "octos-research")' /tmp/octos-ci-selection.json)
          windows_cli_lib_commands=$(jq -c '.windows_cli_lib_commands' /tmp/octos-ci-selection.json)
          windows_cli_integration_commands=$(jq -c '.windows_cli_integration_commands' /tmp/octos-ci-selection.json)
          windows_workspace_commands=$(jq -c '.windows_workspace_commands' /tmp/octos-ci-selection.json)
          dashboard=$full_ci
          swarm_app=$full_ci
          if [ "$docs_only" = false ] && grep -qE '^dashboard/' <<<"$FILES"; then dashboard=true; fi
          if [ "$docs_only" = false ] && grep -qE '^swarm-app/' <<<"$FILES"; then swarm_app=true; fi

          for name in research_only windows_neutral full_ci docs_only selective packages light_packages light_package_names agent_selected cli_selected research_selected dashboard swarm_app windows_cli_lib_commands windows_cli_integration_commands windows_workspace_commands; do
            echo "$name=${!name}" | tee -a "$GITHUB_OUTPUT"
          done

          # A main push may skip duplicate required-test execution only with
          # an exact-SHA merge-group run whose required jobs all succeeded.
          # Non-required e2e/build/release work still runs on main. Any
          # probe/API/script failure retains the original full CI path.
          main_dedup=false
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.run_attempt }}" = "1" ]; then
            if ! GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" python3 scripts/ci-main-merge-proof.py --out /tmp/octos-main-merge-proof.json; then
              echo '{"skip_duplicate_tests": false, "reason": "proof script failed; full CI retained"}' > /tmp/octos-main-merge-proof.json
            fi
            if ! main_dedup=$(jq -r 'if .skip_duplicate_tests == true then "true" else "false" end' /tmp/octos-main-merge-proof.json 2>/dev/null); then
              main_dedup=false
            fi
            if [ "$main_dedup" != true ]; then main_dedup=false; fi
          fi
          echo "main_dedup=$main_dedup" | tee -a "$GITHUB_OUTPUT"

  check:
    needs: scope
    runs-on: ${{ vars.OCTOS_CI_SELF_HOSTED == 'true' && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","octos-ci"]') || 'ubuntu-latest' }}
    env:
      # Defense-in-depth OOM caps. Even after sharding the heaviest crates
      # (octos-agent, octos-cli) into dedicated jobs (#672), the lean `check`
      # job still compiles the full workspace for clippy + light-crate tests,
      # so we keep the same caps that PR #672's prior commit established:
      #
      # 1. Hosted CARGO_BUILD_JOBS=1 serializes rustc/linker invocations so
      #    two peaks never overlap on 16GB ubuntu-latest; octos-ci uses 16.
      #
      # 2. CARGO_PROFILE_{TEST,DEV}_DEBUG=line-tables-only — drop full DWARF
      #    (debug=2) to file/line only, shrinking each linker invocation's
      #    peak RSS while preserving panic-backtrace usefulness.
      #
      # The actual OOM that JOBS=1 + line-tables-only could not fix was
      # memory accumulation across N sequential heavy-crate test steps in
      # the same runner (run 25137059453, job 73677952504 — runner lost
      # communication with the server during `Test octos-agent (lib)`,
      # 54min in). The structural fix is sharding: see test-octos-agent
      # (matrix: lib + integration) and test-octos-cli below, which each
      # get their own fresh 16GB runner. This `check` job now only handles
      # the light crates and workspace-level checks (fmt, clippy, doc tests).
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Raise build parallelism on self-hosted runner
        if: runner.environment == 'self-hosted'
        run: echo "CARGO_BUILD_JOBS=16" >> "$GITHUB_ENV"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Tool description exclusivity lint
        run: |
          python3 scripts/lint-tool-descriptions.py --self-test
          python3 scripts/lint-tool-descriptions.py

      - name: CI selector self-test
        run: python3 scripts/tests/test-ci-select-scope.py

      - name: Docs source-reference lint
        run: |
          python3 scripts/lint-doc-references.py --self-test
          python3 scripts/lint-doc-references.py

      - name: book-zh parity lint
        run: |
          python3 scripts/lint-book-zh-parity.py --self-test
          python3 scripts/lint-book-zh-parity.py

      - name: Installer token-hygiene lint
        run: |
          python3 scripts/lint-installer-token-hygiene.py --self-test
          python3 scripts/lint-installer-token-hygiene.py

      - name: UI Protocol wire inventory lint
        run: |
          python3 scripts/lint-ui-protocol-inventory.py --self-test
          python3 scripts/lint-ui-protocol-inventory.py

      - name: UPCR filename registry lint
        run: |
          python3 scripts/lint-upcr-registry.py --self-test
          python3 scripts/lint-upcr-registry.py

      # T-0496: a PR must not net-grow the test suite (shu 11-07). Same
      # counting algorithm as wake/test-lines.py over git archive of base
      # and head. merge_group enforces against its own base; push to main
      # only reports. Exemption: `test-growth-approved` applied by a human
      # maintainer — the shared agent account never counts.
      - name: Test-line ratchet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          MG_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) BASE="$PR_BASE_SHA"; HEAD_SHA="$PR_HEAD_SHA"; REPORT_ONLY=false ;;
            merge_group) BASE="$MG_BASE_SHA"; HEAD_SHA="$MG_HEAD_SHA"; REPORT_ONLY=false
              if [ -z "$PR_NUMBER" ] && [[ "$MG_HEAD_REF" =~ pr-([0-9]+)- ]]; then
                PR_NUMBER="${BASH_REMATCH[1]}"
              fi ;;
            *) BASE=HEAD~1; HEAD_SHA=HEAD; REPORT_ONLY=true ;;
          esac
          args=(--repo . --base "$BASE" --head "$HEAD_SHA")
          if [ "$REPORT_ONLY" = true ]; then args+=(--report-only); fi
          if [ -n "$PR_NUMBER" ]; then args+=(--pr "$PR_NUMBER" --repo-slug "${{ github.repository }}"); fi
          python3 scripts/ci-test-line-ratchet.py --self-test
          python3 scripts/ci-test-line-ratchet.py "${args[@]}"

      - name: UPCR decentralized merge-lane proof
        run: bash scripts/tests/test-upcr-decentralized-registry.sh

      - name: UPCR coverage gate self-test
        run: bash scripts/tests/test-check-ui-protocol-upcr.sh

      - name: Main merge-proof and dedup structure self-test
        run: python3 scripts/tests/test-ci-main-merge-proof.py

      - name: Self-hosted Linux routing self-test
        run: python3 scripts/tests/test-ci-self-hosted-routing.py

      - name: Windows shard structure self-test
        run: python3 scripts/tests/test-ci-windows-shards.py

      # The coverage gate diffs HEAD against a base and fails loud when that
      # range is empty on a clean tree — which is exactly what it would see
      # against origin/main on a push-to-main checkout. PRs diff against
      # their merge-base; direct main pushes override the base with
      # github.event.before and merge groups use merge_group.base_sha so both
      # backstop lanes keep the same protection; workflow_dispatch has
      # neither base shape, so it runs only the self-test above, which keeps
      # the gate script from rotting between protocol changes.
      - name: UPCR coverage gate (PR)
        if: github.event_name == 'pull_request'
        run: bash scripts/check-ui-protocol-upcr.sh

      - name: UPCR coverage gate (merge group)
        if: github.event_name == 'merge_group'
        env:
          UPCR_BASE_REF: ${{ github.event.merge_group.base_sha }}
        run: bash scripts/check-ui-protocol-upcr.sh

      - name: UPCR coverage gate (direct push)
        if: github.event_name == 'push'
        env:
          UPCR_BASE_REF: ${{ github.event.before }}
        run: bash scripts/check-ui-protocol-upcr.sh

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        if: needs.scope.outputs.docs_only != 'true'
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: needs.scope.outputs.docs_only != 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Compile check cache (dedup main)
        if: needs.scope.outputs.main_dedup == 'true'
        run: |
          cargo build -p octos-sandbox
          cargo test --workspace --exclude octos-agent --exclude octos-cli --exclude octos-sandbox --all-targets --no-run

      - name: Check formatting
        if: (needs.scope.outputs.docs_only != 'true') && needs.scope.outputs.main_dedup != 'true'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: (needs.scope.outputs.full_ci == 'true') && needs.scope.outputs.main_dedup != 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy selected light crates
        if: (needs.scope.outputs.selective == 'true' && needs.scope.outputs.light_packages != '') && needs.scope.outputs.main_dedup != 'true'
        env:
          PACKAGES: ${{ needs.scope.outputs.light_packages }}
        run: cargo clippy $PACKAGES --all-targets -- -D warnings

      - name: Install Linux sandbox prerequisites
        if: (needs.scope.outputs.full_ci == 'true') && needs.scope.outputs.main_dedup != 'true' && runner.environment == 'github-hosted'
        run: bash scripts/setup-host-managed-linux-ci.sh

      - name: Verify Linux sandbox prerequisites (self-hosted)
        if: (needs.scope.outputs.full_ci == 'true') && needs.scope.outputs.main_dedup != 'true' && runner.environment == 'self-hosted'
        run: bash scripts/check-host-managed-linux-ci.sh

      # Full CI selects every workspace member, so this same dynamic shard is
      # also the merge-group/main coverage path — never a second hardcoded
      # allowlist. Run crates in separate Cargo processes to bound memory, and
      # retain the three F3 feature-gated suites without enabling live tests.
      - name: Test selected light crates and feature variants
        if: (needs.scope.outputs.light_package_names != '') && needs.scope.outputs.main_dedup != 'true'
        env:
          PACKAGES: ${{ needs.scope.outputs.light_package_names }}
        run: |
          set -euo pipefail
          completed=0
          expected=0
          for package in $PACKAGES; do
            expected=$((expected + 1))
            cargo test -p "$package" --locked
            case "$package" in
              octos-diagnostics) feature=github ;;
              octos-embed-llama) feature=embed-llama ;;
              octos-pyo3) feature=python ;;
              *) feature= ;;
            esac
            if [ -n "$feature" ]; then
              cargo test -p "$package" --features "$feature" --locked
            fi
            completed=$((completed + 1))
          done
          if [ "$completed" -ne "$expected" ]; then
            echo "light shard incomplete: $completed/$expected" >&2
            exit 1
          fi
          echo "workspace light shard completed: $completed/$expected crates (plus selected feature variants)"

      - name: Test selected octos-research without default features
        if: (needs.scope.outputs.research_selected == 'true') && needs.scope.outputs.main_dedup != 'true'
        run: cargo test -p octos-research --no-default-features --locked

      # The api-gated octos-bus suite only runs workspace-wide in the nightly
      # and self-hosted lanes (octos-bus/api is enabled there via feature
      # unification), so the #2736 chat token gate — and the #2735 admin
      # shell guards before it — never executed on PR CI.
      - name: Test octos-bus api-gated suite
        if: (needs.scope.outputs.full_ci == 'true') && needs.scope.outputs.main_dedup != 'true'
        run: cargo test -p octos-bus --features api --lib --test api_channel_token_e2e

      # RFC-2 (issue #1291): validate every bundled `crates/app-skills/*/manifest.json`
      # against the strict octos JSON schema validator. A failure here means a
      # bundled skill ships a manifest shape that strict LLM-provider validators
      # (Moonshot Kimi K2.6 etc.) will reject at request time — see the
      # 2026-05-25 mofa-slides v0.5.0 incident write-up.
      - name: RFC-2 bundled manifest schema validation
        if: (needs.scope.outputs.docs_only != 'true') && needs.scope.outputs.main_dedup != 'true'
        run: ./scripts/validate-skill-manifests.sh

      # Doc tests — preserved from the prior `cargo test --workspace` coverage
      - name: Doc tests
        if: (needs.scope.outputs.full_ci == 'true') && needs.scope.outputs.main_dedup != 'true'
        run: cargo test --workspace --doc

      # ── Targeted regression filters that fit on the lean runner ─────────────
      # The octos-llm-only regressions stay here (octos-llm already builds
      # in this job for `Test octos-llm`). The octos-cli regressions and
      # octos-agent regression test moved to their respective sharded jobs.
      - name: QoS adaptive/runtime catalog regressions (octos-llm)
        if: (needs.scope.outputs.full_ci == 'true') && needs.scope.outputs.main_dedup != 'true'
        run: |
          cargo test -p octos-llm test_qos_ranking_changes_lane_selection -- --nocapture
          cargo test -p octos-llm test_derive_cold_start_catalog_assigns_non_zero_scores -- --nocapture
          cargo test -p octos-llm test_compatible_fallbacks_prefers_lower_seeded_qos_score -- --nocapture

  # ── Sharded heavy-crate test jobs ────────────────────────────────────────
  # These crates each pull in a >100MB rlib closure (chromiumoxide, lettre,
  # hyper, …) and link 27+ test binaries. Running them sequentially in the
  # `check` job exhausted the 16GB ubuntu-latest runner mid-link (run
  # 25137059453 — "hosted runner lost communication with the server" 54min
  # in). Each crate runs on its own fresh runner; cache keys are shared only
  # within that crate's test family.
  #
  # octos-agent goes one step further: its lib + integration test compile
  # phases EACH peak around the 16GB ceiling (run on PR #672 — integration
  # step was cancelled after lib step's compile already used a chunk of
  # RAM in the same runner). So lib and integration are split into two
  # SEPARATE jobs (each fresh 16GB runner), via a matrix on `test-mode`.
  #
  # Each crate family shares one key across its matrix legs so the main branch
  # publishes a compact cache instead of one multi-GB entry per leg. PRs only
  # restore main's caches (`save-if` is false outside main), so their merge refs
  # cannot evict the shared entries. Distinct crate families keep separate keys.

  test-octos-agent:
    strategy:
      fail-fast: false
      matrix:
        # `lib` runs `--lib` only. `integration` selects every integration
        # test target with `--test '*'` without rebuilding the lib unit-test
        # harness, which `--tests` includes by default.
        # Splitting these onto separate runners means each gets a fresh
        # 16GB allocation and neither inherits residual RAM from the
        # other's compile phase.
        test-mode: [lib, integration]
    needs: scope
    runs-on: ${{ vars.OCTOS_CI_SELF_HOSTED == 'true' && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","octos-ci"]') || 'ubuntu-latest' }}
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      RUST_TEST_THREADS: "1"
    steps:
      - name: Raise build parallelism on self-hosted runner
        if: runner.environment == 'self-hosted' && needs.scope.outputs.main_dedup != 'true'
        run: echo "CARGO_BUILD_JOBS=16" >> "$GITHUB_ENV"

      - name: No selected agent changes
        if: (needs.scope.outputs.full_ci != 'true' && needs.scope.outputs.agent_selected != 'true') && needs.scope.outputs.main_dedup != 'true'
        run: echo "octos-agent is not in the changed-package/direct-dependent selection."

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: needs.scope.outputs.full_ci == 'true' || needs.scope.outputs.agent_selected == 'true'
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        if: needs.scope.outputs.full_ci == 'true' || needs.scope.outputs.agent_selected == 'true'
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: needs.scope.outputs.full_ci == 'true' || needs.scope.outputs.agent_selected == 'true'
        with:
          shared-key: octos-agent-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Compile agent cache (dedup main)
        if: needs.scope.outputs.main_dedup == 'true'
        run: |
          if [ "${{ matrix.test-mode }}" = lib ]; then
            cargo test -p octos-agent --lib --no-run
          else
            bash scripts/cargo-test-glob.sh octos-agent --no-run
          fi

      - name: Clippy selected octos-agent
        if: (matrix.test-mode == 'lib' && needs.scope.outputs.full_ci != 'true' && needs.scope.outputs.agent_selected == 'true') && needs.scope.outputs.main_dedup != 'true'
        run: cargo clippy -p octos-agent --all-targets -- -D warnings

      - name: Test octos-agent (lib)
        if: (matrix.test-mode == 'lib' && (needs.scope.outputs.full_ci == 'true' || needs.scope.outputs.agent_selected == 'true')) && needs.scope.outputs.main_dedup != 'true'
        run: cargo test -p octos-agent --lib

      - name: Test selected octos-agent (doc)
        if: (matrix.test-mode == 'lib' && needs.scope.outputs.full_ci != 'true' && needs.scope.outputs.agent_selected == 'true') && needs.scope.outputs.main_dedup != 'true'
        run: cargo test -p octos-agent --doc

      - name: Test octos-agent (integration)
        if: (matrix.test-mode == 'integration' && (needs.scope.outputs.full_ci == 'true' || needs.scope.outputs.agent_selected == 'true')) && needs.scope.outputs.main_dedup != 'true'
        env:
          # Keep a cache miss viable on the standard runner. This shard links
          # many test binaries, so omit debug info to reduce disk and peak RSS.
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        # `--tests` also builds and runs the lib unit-test harness, duplicating
        # the lib matrix job. The quoted target glob selects integration tests
        # only and prevents the shell from expanding it before Cargo sees it.
        # --test-threads=1: validator_runner.rs::should_kill_child_process_on_validator_timeout
        # spawns a `sh -c "... sleep 30"` child to test the kill path. Under the
        # default thread-per-core parallelism, multiple validator-timeout tests
        # pile up concurrent sleep children and the ubuntu-latest runner gets
        # terminated by GitHub for resource use (deterministic shutdown ~296ms
        # after the preceding test passes). Serialising the integration tests
        # eliminates the pileup. The full integration suite still finishes
        # comfortably within the runner's 6h budget.
        run: bash scripts/cargo-test-glob.sh octos-agent -- --test-threads=1


  # Split four ways so the PR wait is the slowest part (integration, ~35 min on
  # 2026-09-28), not the whole ~90 min serial run. Every step that ran before
  # still runs, in exactly one part: `unit` (lib + the api-feature filter
  # suites + smart-home), `integration` (integration tests + the serial serve
  # process e2e), `oup` (the OUP runtime/C-Python ABI contracts and their
  # evidence), `oup-minimal` (the no-default-features frontend contract and
  # strict lint). All parts restore one shared family cache; only main writes it.
  test-octos-cli:
    name: test-octos-cli (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        # oup-minimal is its own leg (#2421): it rebuilds every target with a
        # --no-default-features fingerprint, so sharing the oup runner paid a
        # second serial full build (~22 min, main run 36430435982) on every
        # PR. The new context is enforced transitively for now — a failure
        # skips the required security job through the test-octos-cli
        # needs-aggregate — so add `test-octos-cli (oup-minimal)` to the
        # branch-protection ruleset's required contexts.
        part: [unit, integration, oup, oup-minimal]
    needs: scope
    runs-on: ${{ vars.OCTOS_CI_SELF_HOSTED == 'true' && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","octos-ci"]') || 'ubuntu-latest' }}
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Raise build parallelism on self-hosted runner
        if: runner.environment == 'self-hosted' && needs.scope.outputs.main_dedup != 'true'
        run: echo "CARGO_BUILD_JOBS=16" >> "$GITHUB_ENV"

      - name: No selected CLI changes in this leg
        if: (needs.scope.outputs.full_ci != 'true' && (needs.scope.outputs.cli_selected != 'true' || matrix.part == 'oup' || matrix.part == 'oup-minimal')) && needs.scope.outputs.main_dedup != 'true'
        run: echo "This CLI leg is not selected; merge_group retains the complete contract suite."

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: needs.scope.outputs.full_ci == 'true' || (needs.scope.outputs.cli_selected == 'true' && (matrix.part == 'unit' || matrix.part == 'integration'))
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        if: needs.scope.outputs.full_ci == 'true' || (needs.scope.outputs.cli_selected == 'true' && (matrix.part == 'unit' || matrix.part == 'integration'))
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: needs.scope.outputs.full_ci == 'true' || (needs.scope.outputs.cli_selected == 'true' && (matrix.part == 'unit' || matrix.part == 'integration'))
        with:
          shared-key: octos-cli-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Compile CLI cache (dedup main)
        if: needs.scope.outputs.main_dedup == 'true'
        run: |
          case "${{ matrix.part }}" in
            unit) cargo test -p octos-cli --lib --bins --no-run ;;
            integration) cargo test -p octos-cli --tests --no-run ;;
            oup) cargo test -p octos-cli --all-targets --features api --no-run ;;
            oup-minimal) cargo test -p octos-cli --all-targets --no-default-features --no-run ;;
            *) echo "unknown CLI part: ${{ matrix.part }}" >&2; exit 1 ;;
          esac

      - name: Clippy selected octos-cli
        if: (matrix.part == 'unit' && needs.scope.outputs.full_ci != 'true' && needs.scope.outputs.cli_selected == 'true') && needs.scope.outputs.main_dedup != 'true'
        run: cargo clippy -p octos-cli --all-targets -- -D warnings

      - name: Test octos-cli (lib + bins)
        if: (matrix.part == 'unit' && (needs.scope.outputs.full_ci == 'true' || needs.scope.outputs.cli_selected == 'true')) && needs.scope.outputs.main_dedup != 'true'
        # --test '*' below excludes lib and bin unit tests. Select both here so
        # the six bin tests have exactly one consumer and lib never reruns.
        run: cargo test -p octos-cli --lib --bins

      - name: Test selected octos-cli (doc)
        if: (matrix.part == 'unit' && needs.scope.outputs.full_ci != 'true' && needs.scope.outputs.cli_selected == 'true') && needs.scope.outputs.main_dedup != 'true'
        run: cargo test -p octos-cli --doc

      - name: Test octos-cli (integration, excluding serve process e2e)
        if: (matrix.part == 'integration' && (needs.scope.outputs.full_ci == 'true' || needs.scope.outputs.cli_selected == 'true')) && needs.scope.outputs.main_dedup != 'true'
        # `--tests` also reruns the lib unit harness in the unit leg. Select
        # integration targets only, matching the agent matrix above.
        run: bash scripts/cargo-test-glob.sh octos-cli -- --skip serve_broken_pipe --skip serve_solo_gateway_guard --skip serve_sigterm --skip serve_ws_liveness --skip serve_host_managed

      - name: OUP runtime and C/Python contracts
        if: (matrix.part == 'oup' && needs.scope.outputs.full_ci == 'true') && needs.scope.outputs.main_dedup != 'true'
        run: ./scripts/milestone-ci.sh oup-runtime

      # Real-octos-process BrokenPipe/SIGINT e2e (serve_broken_pipe), solo
      # manual-start guard e2e (serve_solo_gateway_guard), SIGTERM gateway-reap
      # e2e (serve_sigterm), WS half-open liveness e2e (serve_ws_liveness), and
      # host-managed ownership e2e (serve_host_managed: stdin EOF, host SIGKILL,
      # inherited listener).
      # These spawn real
      # `octos serve` children that contend for model catalog / profile
      # store resources with other test binaries; under the default
      # thread-per-core parallelism the children starve and the 15s port
      # barrier times out. Dedicated serial step per the #21 outer-loop
      # ruling (2026-08-27): layer at the CI command level, never #[ignore].
      - name: serve BrokenPipe/solo-guard/SIGTERM/WS-liveness/host-managed process e2e (serial)
        if: (matrix.part == 'integration' && needs.scope.outputs.full_ci == 'true') && needs.scope.outputs.main_dedup != 'true'
        run: cargo test -p octos-cli --features api --test serve_broken_pipe --test serve_solo_gateway_guard --test serve_sigterm --test serve_ws_liveness --test serve_host_managed -- --test-threads=1

      # API feature filters run in the unit lane and reuse its warm build cache.
      # ci-api-filter-test.sh rejects every zero-match filter (#2029). The
      # retained inventory keeps only the guarded filters below.

      # The §6 catalog guard lives in the feature-gated `api` module, so the
      # unfeatured lib/integration runs above never compile it. Run it
      # explicitly so UI Protocol spec/impl drift actually fails CI.
      - name: UI Protocol §6 catalog guard (octos-cli)
        if: (matrix.part == 'unit' && needs.scope.outputs.full_ci == 'true') && needs.scope.outputs.main_dedup != 'true'
        run: ./scripts/ci-api-filter-test.sh spec_section6_catalog_lists_every_advertised_method -- --nocapture

      # Peer staging/fencing lives in the `api`-gated ui_protocol module, so the
      # unfeatured runs above never compile it — same reason as the §6 guard.
      # These cover slug reservation, worktree fencing, and the rollback
      # isolation guard (one peer's cleanup must not delete a SIBLING's
      # worktree, which a repo-global `git worktree prune` used to do).
      - name: Peer staging + worktree fencing (octos-cli)
        if: (matrix.part == 'unit' && needs.scope.outputs.full_ci == 'true') && needs.scope.outputs.main_dedup != 'true'
        run: ./scripts/ci-api-filter-test.sh peer

      # #2019 human sink: the `background/activity` capability gate and the
      # durable per-session replay both live in the `api`-gated ui_protocol
      # module, so the unfeatured runs above never compile them — same reason
      # as the §6 guard. The routing assertion itself is deliberately in
      # non-gated `crate::autonomy` and DOES run in the unfeatured lib step;
      # this covers the two halves that cannot.
      - name: Background activity human sink (octos-cli)
        if: (matrix.part == 'unit' && needs.scope.outputs.full_ci == 'true') && needs.scope.outputs.main_dedup != 'true'
        run: ./scripts/ci-api-filter-test.sh background_activity -- --nocapture

      # Retained real WS → profile config → smart-home bridge → response chain.
      - name: Smart-home WS e2e (octos-cli)
        if: (matrix.part == 'unit' && needs.scope.outputs.full_ci == 'true') && needs.scope.outputs.main_dedup != 'true'
        run: cargo test -p octos-cli --features api --test smart_home_ws_e2e

      - name: Minimal OUP frontend contract
        if: (matrix.part == 'oup-minimal' && needs.scope.outputs.full_ci == 'true') && needs.scope.outputs.main_dedup != 'true'
        run: ./scripts/milestone-ci.sh oup-minimal

      - name: Retain OUP runtime evidence
        if: (always() && matrix.part == 'oup' && needs.scope.outputs.full_ci == 'true') && needs.scope.outputs.main_dedup != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: oup-runtime-evidence
          path: target/oup-functional/
          retention-days: 14
          if-no-files-found: error

      # Same evidence dir as the runtime leg, distinct artifact name: two
      # matrix legs may not upload under one name in the same run.
      - name: Retain OUP minimal evidence
        if: (always() && matrix.part == 'oup-minimal' && needs.scope.outputs.full_ci == 'true') && needs.scope.outputs.main_dedup != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: oup-minimal-evidence
          path: target/oup-functional/
          retention-days: 14
          if-no-files-found: error

  # Branch protection requires the `test-octos-cli (unit|integration|oup)`
  # contexts — but those check names only come into existence once GitHub
  # expands the matrix, and on a research-only PR the whole job is skipped at
  # its job-level `if`, so the matrix never expands and the required contexts
  # sit at "expected" forever. That dead-end is why research-only PRs
  # (#2832, #2645, #2310) could only be merged with an admin bypass ("3 of 10
  # required status checks are expected"). This non-matrix gate always
  # reports a single stable context: green when the matrix ran green, and
  # green on an intentional selective/docs-only skip; anything else (failure,
  # cancellation, or a skip during full-ci) is red. Point the branch-protection
  # ruleset at this one context instead of matrix expansion.
  test-octos-cli-gate:
    name: test-octos-cli-gate
    needs: [scope, test-octos-cli]
    if: always()
    runs-on: ${{ vars.OCTOS_CI_SELF_HOSTED == 'true' && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","octos-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Verify test-octos-cli outcome
        env:
          RESULT: ${{ needs.test-octos-cli.result }}
          RESEARCH_ONLY: ${{ needs.scope.outputs.research_only }}
          FULL_CI: ${{ needs.scope.outputs.full_ci }}
        run: |
          echo "test-octos-cli: ${RESULT}, research_only: ${RESEARCH_ONLY}, full_ci: ${FULL_CI}"
          if [ "$RESULT" = success ]; then
            exit 0
          fi
          if [ "$RESULT" = skipped ] && [ "$FULL_CI" = false ]; then
            echo "selective/docs-only PR: test-octos-cli skipped by design; gate green"
            exit 0
          fi
          echo "::error::test-octos-cli finished with ${RESULT} (research_only=${RESEARCH_ONLY}, full_ci=${FULL_CI})"
          exit 1

  # Lightweight check that exercises the `matrix` feature gate. The default
  # `FEATURES` env above intentionally omits `matrix` to keep the main `check`
  # job lean, but the Dockerfile and several release configurations enable it.
  # Without this job, feature-gated compile errors (e.g. an identifier referenced
  # only inside `#[cfg(feature = "matrix")]`) slip past PR CI and only surface
  # during docker builds. It also carries the clippy gate for the feature-gated
  # channel modules: the non-api channels stay outside octos-cli's default
  # features, so the workspace clippy in `check` never lints them — and clippy
  # subsumes `cargo check`. And it runs the feature-gated octos-bus matrix
  # test suite: with the feature off (as in `check`'s `cargo test -p
  # octos-bus`) the whole suite is cfg'd out, and the workspace-wide runs that
  # do execute it only exist in the nightly and self-hosted lanes.
  check-matrix:
    needs: scope
    if: needs.scope.outputs.full_ci == 'true'
    runs-on: ${{ vars.OCTOS_CI_SELF_HOSTED == 'true' && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","octos-ci"]') || 'ubuntu-latest' }}
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Raise build parallelism on self-hosted runner
        if: runner.environment == 'self-hosted' && needs.scope.outputs.main_dedup != 'true'
        run: echo "CARGO_BUILD_JOBS=16" >> "$GITHUB_ENV"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: matrix-feature
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Workspace/all-target builds can unify the api or cfg(test) gates and
      # hide missing symbols in FFI consumers of the minimal production lib.
      - name: Compile matrix cache (dedup main)
        if: needs.scope.outputs.main_dedup == 'true'
        run: |
          cargo test -p octos-cli --all-targets --no-default-features --features api,telegram,discord,dingtalk,slack,whatsapp,feishu,email,matrix,audio_mp3 --no-run
          cargo test -p octos-bus --features matrix --no-run

      # Workspace/all-target builds can unify the api or cfg(test) gates and
      # hide missing symbols in FFI consumers of the minimal production lib.
      - name: Clippy minimal octos-cli production library
        if: needs.scope.outputs.main_dedup != 'true'
        run: cargo clippy -p octos-cli --lib --no-default-features -- -D warnings

      - name: Clippy octos-cli with matrix feature
        if: needs.scope.outputs.main_dedup != 'true'
        run: cargo clippy -p octos-cli --all-targets --no-default-features --features api,telegram,discord,dingtalk,slack,whatsapp,feishu,email,matrix,audio_mp3 -- -D warnings

      # The suite itself: its only PR-time execution. Floor-check the listing
      # first so the gate fails loudly if the suite silently drops to zero
      # (the #2029 lesson).
      - name: Test octos-bus with the matrix feature
        if: needs.scope.outputs.main_dedup != 'true'
        run: |
          count=$(cargo test -p octos-bus --features matrix -- --list matrix_ | grep -c ': test$')
          if [ "$count" -lt 100 ]; then
            echo "::error::only $count matrix-gated tests listed; expected the suite floor of 100"
            exit 1
          fi
          cargo test -p octos-bus --features matrix

  check-arm:
    # Deliberately NOT on PRs, unlike check-windows: the workspace has ZERO
    # `cfg(target_arch)` sites, so there is no arch-specific code for this to
    # catch that the x86 jobs do not already compile — and it costs ~67 min.
    # The full ARM lane moved to nightly.yml. Keep this manual escape hatch for
    # focused diagnosis without putting every main push behind the scarce ARM
    # runner or duplicating the nightly workload.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    env:
      CARGO_BUILD_JOBS: "2"  # Limit parallelism to avoid OOM on 16GB ARM runners
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: arm64

      - name: Build (workspace + all features)
        run: |
          cargo build --workspace
          cargo build -p octos-cli --features ${{ env.FEATURES }}

      - name: Build test binaries
        run: cargo test --workspace --no-run

      # Sharded per-crate tests — same rationale as the `check` job.
      - name: Test octos-core
        run: cargo test -p octos-core
      - name: Test octos-memory
        run: cargo test -p octos-memory
      - name: Test octos-llm (lib)
        run: cargo test -p octos-llm --lib
      - name: Test octos-llm (integration)
        if: hashFiles('crates/octos-llm/tests/**/*.rs') != ''
        run: cargo test -p octos-llm --tests
      - name: Test octos-bus
        run: cargo test -p octos-bus
      - name: Test octos-plugin
        run: cargo test -p octos-plugin
      - name: Install Linux sandbox prerequisites
        if: runner.environment == 'github-hosted'
        run: bash scripts/setup-host-managed-linux-ci.sh

      - name: Verify Linux sandbox prerequisites (self-hosted)
        if: runner.environment == 'self-hosted'
        run: bash scripts/check-host-managed-linux-ci.sh
      - name: Test octos-sandbox
        run: cargo test -p octos-sandbox
      - name: Test octos-swarm
        run: cargo test -p octos-swarm
      - name: Test octos-agent (lib)
        run: cargo test -p octos-agent --lib
      - name: Test octos-agent (integration)
        if: hashFiles('crates/octos-agent/tests/**/*.rs') != ''
        run: cargo test -p octos-agent --tests
      - name: Test octos-cli (lib)
        run: cargo test -p octos-cli --lib
      # Same serve-process exclusions as the test-octos-cli PR job: the
      # serve_broken_pipe / serve_solo_gateway_guard / serve_sigterm /
      # serve_ws_liveness / serve_host_managed e2e suites
      # spawn real `octos serve` children that starve under default
      # thread-per-core parallelism. They get their dedicated serial run in
      # test-octos-cli; skipping here keeps this manual lane's coverage
      # semantics identical to the PR lane's.
      - name: Test octos-cli (integration, excluding serve process e2e)
        run: cargo test -p octos-cli --tests -- --skip serve_broken_pipe --skip serve_solo_gateway_guard --skip serve_sigterm --skip serve_ws_liveness --skip serve_host_managed
      - name: Test harness starter skills
        run: |
          cargo test -p harness-starter-generic
          cargo test -p harness-starter-report
          cargo test -p harness-starter-audio
          cargo test -p harness-starter-coding
      - name: Doc tests
        run: cargo test --workspace --doc

  check-riscv:
    # MANUAL ONLY — this job is the reason `main` has had no CI signal for weeks.
    #
    # There is no runner for the `ubuntu-24.04-riscv` label. Every dispatch sits
    # in `queued` with `runner_id: 0`, `runner_name: ""` and `steps: []` until
    # GitHub's fixed 24 h *queue* ceiling kills it. Job 89914973597 in run
    # 30244166464: 2026-07-27T07:33:57Z → 2026-07-28T07:33:58Z, zero steps, no
    # runner ever assigned. All 22 such jobs in the last 50 `main` runs died at
    # exactly 24:00:00–01. Not one has ever executed a step.
    #
    # Note this is a QUEUE limit, so `timeout-minutes` does NOT bound it —
    # that only starts counting once a runner picks the job up.
    #
    # While queued it holds a manual run open for a full day. Move it into the
    # nightly matrix only after a riscv64 runner is actually registered.
    if: github.event_name == 'workflow_dispatch' && inputs.check_riscv
    runs-on: ubuntu-24.04-riscv

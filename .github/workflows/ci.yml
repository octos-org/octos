  # Change detection lives in its OWN job so that "nothing relevant changed"
  # surfaces as a SKIPPED e2e check rather than a green one. Previously the
  # filter set a step-level flag and every step carried
  # `if: steps.changes.outputs.run == 'true'` — a job whose steps all skip
  # still concludes SUCCESS, so `e2e-tool-regression: SUCCESS` was
  # indistinguishable from "the suite ran and passed". It had not actually
  # executed in any of the last 14 CI runs (#2015).
  e2e-changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      # fetch-depth: 0 is load-bearing: the diff below needs HEAD~1 (push) and
      # the PR base sha (pull_request). The default depth-1 checkout has
      # NEITHER, the old `|| echo ""` masked the resulting fatal error, and
      # FILES came out empty — so this job silently never ran its tests.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for relevant changes
        id: changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          else
            FILES=$(git diff --name-only HEAD~1 HEAD)
          fi
          echo "Changed files:"
          echo "$FILES"
          # `.github/workflows/ci.yml` is in the list so that changes to THIS
          # job are self-testing. Without it a PR that repairs the e2e gate
          # cannot observe its own repair — the gate skips itself.
          if echo "$FILES" | grep -qE '(activate_tools|sandbox|shell\.rs|tools/mod|session_actor|exec_env|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  e2e-tool-regression:
    runs-on: macos-14
    needs: [check, test-octos-agent, test-octos-cli, e2e-changes]
    # Run on pushes to main and on every PR whose diff touches the paths in
    # `e2e-changes`. PR-title keyword matching used to gate this job, so a PR
    # that changed tools without saying so in the title skipped e2e entirely.
    if: needs.e2e-changes.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # MUST precede the cargo build: the admin SPA is embedded into the
      # binary at COMPILE time via `rust_embed::Embed` (api/static_files.rs),
      # not read from disk at runtime, so building it afterwards has no
      # effect. `crates/octos-cli/static/admin/` is gitignored by the
      # ephemeral-bundle policy and `scripts/build-dashboard.sh` runs in the
      # separate `dashboard` job, whose filesystem this job never sees.
      # Without this, `/admin/login` answers 503 (static_files.rs:169), the
      # setup-wizard readiness probe never gets its 2xx, and the whole suite
      # fails on a six-minute timeout that has nothing to do with the diff
      # under test (#2015).
      - name: Build dashboard bundle (embedded at compile time)
        run: ./scripts/build-dashboard.sh

      - name: Build octos with all features
        run: cargo build --release -p octos-cli --features "octos-cli/api,octos-cli/telegram"

      - name: Install Homebrew ffmpeg (macOS)
        run: brew install ffmpeg

      # #2031 — the four ffmpeg/PATH specs in `tool-use-regression.spec.ts`
      # drive `POST /api/admin/shell`, and that route is registered ONLY when
      # `allow_admin_shell` is true (api/router.rs). It defaults to false and
      # nothing in CI ever set it, so every one of those requests answered
      # 404 `{"error":"not_found"}`. `res.json()` on that body has no
      # `exit_code` field, which is why the failures read
      # `expect(result.exit_code).toBe(0) // Received: undefined` — an absent
      # route, not a missing binary and not a PATH problem.
      #
      # This is a full-RCE endpoint, so it is enabled here and nowhere else:
      # an ephemeral runner, bound to loopback, behind an admin token. Do not
      # copy this config to anything long-lived.
      - name: Write CI serve config (enables the admin shell endpoint)
        run: |
          echo '{"allow_admin_shell": true}' > /tmp/octos-ci-serve.json

      - name: Start octos serve
        run: |
          OCTOS_AUTH_TOKEN=ci-test-token ./target/release/octos serve --port 3000 \
            --config /tmp/octos-ci-serve.json &
          # Wait for server to be ready.
          #
          # `/api/status` is a 404 — this probe has never once succeeded, so the
          # loop always burned its full 30 iterations and the job continued
          # regardless of whether the server was up. `/health` is the endpoint
          # that answers 200. Not being ready is now a hard failure instead of a
          # silent 30-second sleep followed by racy assertions.
          ready=""
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              ready=1
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::octos serve never answered /health on port 3000 after 30s."
            exit 1
          fi

      # Fail loudly at the precondition rather than inside four assertions that
      # each report it as `undefined`. If this step ever 404s again, the config
      # above stopped taking effect — that is a different bug from ffmpeg being
      # absent, and the two were conflated for long enough to be worth naming.
      - name: Verify the admin shell endpoint is live
        run: |
          body=$(curl -s -w '\n%{http_code}' -X POST http://localhost:3000/api/admin/shell \
            -H "Authorization: Bearer ci-test-token" \
            -H 'Content-Type: application/json' \
            -d '{"command":"command -v ffmpeg"}')
          code=$(echo "$body" | tail -1)
          echo "$body" | sed '$d'
          if [ "$code" != "200" ]; then
            echo "::error::/api/admin/shell answered HTTP $code — expected 200."
            exit 1
          fi

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      # `npm ci` installs the @playwright/test PACKAGE but NOT the browser
      # binaries. Several specs in this suite (dashboard/harness/swarm-gate)
      # launch chrome-headless-shell, so without this step the job only passed
      # when the runner happened to have a warm ~/Library/Caches/ms-playwright
      # from an earlier run. Once that cache aged out, every run failed with
      # `browserType.launch: Executable doesn't exist at
      # .../chromium_headless_shell-*/chrome-headless-shell` — a green-vs-red
      # coin flip decided by runner assignment, not by the diff under test.
      # `install chromium` also fetches the headless shell.
      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install chromium

      # #1923 — run THIS job's namesake, not all 52 specs.
      #
      # `npx playwright test` with no filter swept in the whole e2e tree,
      # including specs that ask a live model for specific words
      # (`toContain('OK')`, `toContain('ALPHA')`, "answer in Chinese"). Those
      # fail when a model phrases an answer differently or when CI has no
      # provider credential — failures nobody can act on. A required check that
      # fails for unactionable reasons gets routed around, which is exactly what
      # happened: this job was narrowed to a path filter, went red on main, and
      # reported SUCCESS by simply not running.
      #
      # Required checks stay deterministic. The model-dependent specs run in
      # Model-dependent coverage lives in nightly.yml, where it reports a
      # regression without making model phrasing a merge gate.
      - name: Run e2e tool regression tests
        working-directory: e2e
        run: OCTOS_TEST_URL=http://localhost:3000 OCTOS_AUTH_TOKEN=ci-test-token npx playwright test --reporter=line tests/tool-use-regression.spec.ts

      # #2073 — the model-INDEPENDENT half of the m9 protocol suite, gating.
      #
      # These specs assert typed JSON-RPC envelopes and cursor semantics
      # against a serve with no provider configured at all: unknown/malformed
      # ids rejected as INVALID_PARAMS, baseline and strictly-later cursors,
      # cursor_expired, cursor_stream_mismatch. No model is asked for anything,
      # so nothing here can flake on phrasing — they belong on the required
      # path, not in the nightly.
      #
      # Only these two files are listed because only these two are green
      # without a configured profile. The rest of the m9 tree (turn/start,
      # tool events, interrupt, most of fault-injection) needs a `_main`
      # profile with a provider and answers `-32602 profile '_main' is not
      # configured` without one; the deterministic profile fixture lives in
      # nightly.yml.
      - name: Run m9 protocol conformance (model-independent)
        working-directory: e2e
        run: OCTOS_TEST_URL=http://localhost:3000 OCTOS_AUTH_TOKEN=ci-test-token npx playwright test --reporter=line tests/m9-protocol-session-open.spec.ts tests/m9-protocol-diff-preview.spec.ts

      - name: Stop octos serve
        if: always()
        run: pkill -f "octos serve" || true

  security:
    runs-on: macos-14
    needs: [check, test-octos-agent, test-octos-cli]
    # Run on pushes and on every PR — the file-level detection below is the
    # only filter (title keyword matching used to let security-relevant PRs
    # slip through when the title didn't say "security"/"sandbox").
    steps:
      # fetch-depth: 0 is load-bearing: with the old depth-2 checkout the PR
      # base sha was absent, the masked git-diff failure produced FILES="",
      # and the security suite silently never ran on PRs.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2

      - name: Check for security-related changes
        id: changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          else
            FILES=$(git diff --name-only HEAD~1 HEAD)
          fi
          echo "Changed files:"
          echo "$FILES"
          # `session_scope` is the path-containment boundary behind
          # `classify_canonical_path`; it is NOT covered by `session_actor`.
          if echo "$FILES" | grep -qE '(sandbox|ssrf|security|tools/mod|session_actor|session_scope|profiles)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Security sandbox tests (macOS kernel enforcement)
        if: steps.changes.outputs.run == 'true'
        run: |
          echo "Running 24 security integration tests on macOS (sandbox-exec SBPL)"
          cargo test -p octos-agent --test security_sandbox -- --nocapture

  # One stable status for branch protection. Individual jobs can be renamed or
  # conditionally skipped without requiring a repository-ruleset edit, while a
  # real failure or cancellation still makes this gate red.
  ci-required:
    name: CI required
    if: always()
    needs:
      - dashboard
      - swarm-app
      - typos
      - ux-gate-report
      - windows-deploy-script
      - web-app-base-url-windows
      - check
      - test-octos-agent
      - test-octos-cli
      - check-matrix
      - check-windows
      - e2e-changes
      - e2e-tool-regression
      - security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every mandatory job and reject failed optional jobs
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq .

          for job in dashboard swarm-app typos ux-gate-report \
            windows-deploy-script web-app-base-url-windows check \
            test-octos-agent test-octos-cli check-matrix check-windows \
            e2e-changes security; do
            result=$(echo "$RESULTS" | jq -r --arg job "$job" '.[$job].result')
            if [ "$result" != success ]; then
              echo "::error::required job $job finished with $result"
              exit 1
            fi
          done

          optional=$(echo "$RESULTS" | jq -r \
            '[."e2e-tool-regression".result] | map(select(. != "success" and . != "skipped")) | join(",")')
          if [ -n "$optional" ]; then
            echo "::error::conditional E2E job finished with $optional"
            exit 1
          fi

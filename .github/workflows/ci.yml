      # two blocks were the only multi-command steps in this job.
      - name: Check octos-cli + all features (PR)
        if: (github.event_name == 'pull_request' && runner.environment == 'github-hosted') && needs.scope.outputs.main_dedup != 'true'
        run: cargo check -p octos-cli --features ${{ env.FEATURES }}

      - name: Build octos-cli + all features (main/manual)
        if: (github.event_name != 'pull_request' || runner.environment == 'self-hosted') && needs.scope.outputs.main_dedup != 'true'
        run: cargo build -p octos-cli --features ${{ env.FEATURES }}

      # Changed integration tests select their own targets, not the whole CLI
      # suite. The list floor also catches a target renamed without a selector
      # update before the test command can report a false-green zero.
      - name: Test changed octos-cli integration targets (PR)
        if: (github.event_name == 'pull_request' && runner.environment == 'github-hosted' && needs.scope.outputs.windows_cli_integration_commands != '[]') && needs.scope.outputs.main_dedup != 'true'
        env:
          WINDOWS_TEST_COMMANDS: ${{ needs.scope.outputs.windows_cli_integration_commands }}
        run: >-
          $commands = $env:WINDOWS_TEST_COMMANDS | ConvertFrom-Json -NoEnumerate; foreach ($command in $commands) { $listed = & cargo @command -- --list; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; $count = @($listed | Select-String ': test$').Count; Write-Host "Windows selected test list: $count tests for $($command -join ' ')"; if ($count -lt 1) { Write-Error "changed integration target listed zero tests"; exit 1 }; & cargo @command; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }

      # #2239: default-feature tests never compile the API's test-only secret
      # hooks. Exercise those callers on Windows too, using isolated fixtures.
      - name: Test octos-cli (integration)
        if: ${{ ((github.event_name != 'pull_request' || runner.environment == 'self-hosted') && !cancelled()) && needs.scope.outputs.main_dedup != 'true' }}
        # Keep the lib suite in its own step; select integration targets only.
        run: bash scripts/cargo-test-glob.sh octos-cli

      # Moved from the workspace shard: at 316s it pushed that shard to
      # 30m34s, over the 30-minute merge-group budget. This shard (16m18s)
      # has the headroom; the octos-cli all-features build already compiled
      # nearly the whole dependency tree the doctests need.
      - name: Doc tests
        if: ${{ ((github.event_name != 'pull_request' || runner.environment == 'self-hosted') && !cancelled()) && needs.scope.outputs.main_dedup != 'true' }}
        run: cargo test --workspace --doc

  check-windows-workspace:
    needs: scope
    if: needs.scope.outputs.full_ci == 'true' || needs.scope.outputs.windows_workspace_commands != '[]'
    # Same-repo PRs run on the repo-owned Windows pool when OCTOS_CI_WINDOWS

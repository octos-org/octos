    runs-on: ${{ github.event_name != 'pull_request' && vars.OCTOS_MAC_POOL == 'on' && fromJSON('["self-hosted","macOS","ARM64","octos-mac"]') || 'macos-15' }}
    env:
      # See check-darwin: fall back to local compilation when the self-hosted
      # pool's sccache server dies mid-build (sccache README, "Usage").
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Reuse installed rustup on the self-hosted pool
        # The octos-mac pool keeps rustup under the runner-local
        # CARGO_HOME/bin (not on PATH); reusing it avoids a rustup-init
        # download per job. Falls back to one bounded-retry download.
        if: runner.environment == 'self-hosted'
        run: bash scripts/ci-ensure-rustup.sh

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        # Self-hosted runners keep target/ and use the shared sccache bucket.
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release
        shell: bash
        run: |
          # rust_embed bakes static/{admin,web} in at compile time → build both
          # SPAs before cargo so the bundle artifact serves /admin and /app.
          # One command per line so `set -e` aborts on ANY failure (a chained
          # `&&` can mask an early failure → an artifact missing /admin or /app).
          cd dashboard
          npm ci
          npm run build
          cd ..
          git submodule update --init octos-web
          bash scripts/build-web-app.sh
          cargo build --release -p octos-cli --features ${{ env.FEATURES }}
          cargo build --release -p octos-sandbox
          cargo build --release ${{ env.SKILL_CRATES }}

      - name: Bundle
        shell: bash
        # Single source of truth for the shipping set: scripts/bundle-release.sh
        # (fails loudly on any missing binary; includes model_catalog.json).
        run: ./scripts/bundle-release.sh octos-bundle-aarch64-apple-darwin.tar.gz


name: retry-nightly-arm

# The hosted ARM runner occasionally disappears without completing a failing
# step. A dead runner cannot retry itself, so this companion workflow retries
# that narrow infrastructure case from outside the nightly workflow.
#
# Discriminator: a killed runner uploads NO logs, while actionable failures
# (compiler, linker, timeout, disk/ENOSPC) always write them. Retry ONLY the
# log-absence signature; everything that wrote logs is an actionable failure
# and is NOT retried — so a real ENOSPC no longer burns ARM runs.

on:
  workflow_run:
    workflows: [Nightly Regression]
    types: [completed]

permissions:
  actions: write # rerun a job in an existing run

concurrency:
  group: retry-check-arm-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Rerun check-arm if it failed and is under the attempt cap
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          JOBS=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs?per_page=100&filter=latest")
          INFO=$(echo "$JOBS" \
            | jq -r '.jobs[] | select(.name == "ARM64 workspace tests" and .conclusion == "failure") | [.id, (.run_attempt // 1)] | @tsv' \
            | head -1)
          if [ -z "${INFO}" ]; then
            echo "ARM64 workspace tests is not failed in run ${RUN_ID} — nothing to retry."
            exit 0
          fi
          JOB_ID=$(echo "${INFO}" | cut -f1)
          ATTEMPT=$(echo "${INFO}" | cut -f2)
          # Death signature: a killed runner uploads no logs (the deleted ci.yml
          # memo's own marker — empirically 5/5 historical runner deaths left a
          # failed step behind, so step-count-based discrimination never fires
          # on the case this retry exists for). Retry only the log-absence
          # signature; everything that wrote logs is actionable.
          LOG_BYTES=$(gh api \
            "repos/${{ github.repository }}/actions/jobs/${JOB_ID}/logs" \
            2>/dev/null | wc -c || echo 0)
          if [ "${LOG_BYTES}" -gt 200 ]; then
            echo "ARM job wrote ${LOG_BYTES} bytes of logs; actionable failure, not runner loss."
            exit 0
          fi
          if [ "${ATTEMPT}" -ge 2 ]; then
            echo "ARM job is at attempt ${ATTEMPT} (>= 2) — not retrying again."
            exit 0
          fi
          echo "Rerunning log-less ARM job ${JOB_ID} once (attempt ${ATTEMPT})."
          gh run rerun --repo "${{ github.repository }}" --job "${JOB_ID}"

name: retry-nightly-arm

# The hosted ARM runner occasionally disappears without completing a failing
# step. A dead runner cannot retry itself, so this companion workflow retries
# that narrow infrastructure case from outside the nightly workflow.
#
# Test, compiler, linker, timeout, and disk failures all leave a failed step and
# are deliberately NOT retried. This prevents the old behavior that reran an
# actionable ENOSPC failure three times and delayed the nightly by hours.

on:
  workflow_run:
    workflows: [Nightly Regression]
    types: [completed]

permissions:
  actions: write # rerun a job in an existing run

concurrency:
  group: retry-check-arm-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Rerun check-arm if it failed and is under the attempt cap
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          JOBS=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs?per_page=100&filter=latest")
          INFO=$(echo "$JOBS" \
            | jq -r '.jobs[] | select(.name == "ARM64 workspace tests" and .conclusion == "failure") | [.id, (.run_attempt // 1)] | @tsv' \
            | head -1)
          if [ -z "${INFO}" ]; then
            echo "ARM64 workspace tests is not failed in run ${RUN_ID} — nothing to retry."
            exit 0
          fi
          JOB_ID=$(echo "${INFO}" | cut -f1)
          ATTEMPT=$(echo "${INFO}" | cut -f2)
          FAILED_STEPS=$(echo "$JOBS" | jq \
            '[.jobs[] | select(.id == '"${JOB_ID}"') | .steps[]? | select(.conclusion == "failure")] | length')
          if [ "$FAILED_STEPS" -gt 0 ]; then
            echo "ARM job contains ${FAILED_STEPS} failed step(s); this is an actionable failure, not runner loss."
            exit 0
          fi
          if [ "${ATTEMPT}" -ge 2 ]; then
            echo "ARM job is at attempt ${ATTEMPT} (>= 2) — not retrying again."
            exit 0
          fi
          echo "Rerunning vanished ARM job ${JOB_ID} once (attempt ${ATTEMPT})."
          gh run rerun --repo "${{ github.repository }}" --job "${JOB_ID}"

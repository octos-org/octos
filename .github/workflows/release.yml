name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (all = full release)'
        required: true
        type: choice
        default: all
        options: [all, macos-arm, linux-x86, linux-arm, windows, docker]
      tag:
        description: 'Tag to release (e.g. v0.1.2-rc5). Required for publish.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_VERSION: "1.97.1"
  # embed-llama: the bundled in-process embedder (llama.cpp, needs cmake on
  # the runner). The macOS job adds Metal below.
  FEATURES: "api,telegram,discord,whatsapp,feishu,twilio,wecom,wecom-bot,audio_mp3,embed-llama"
  SKILL_CRATES: "-p news_fetch -p deep-search -p deep-crawl -p send-email -p account-manager -p voice -p clock -p weather -p office -p smart-home"

jobs:
  check-version:
    name: Verify tag matches workspace version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Compare release tag and Cargo workspace version
        if: github.event_name == 'push' || inputs.tag != ''
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match workspace version v$version"
            exit 1
          fi

  build-macos-arm:
    needs: check-version
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos-arm'
    runs-on: macos-14
    env:
      # Apple Silicon: offload the bundled embedder to Metal.
      FEATURES: "api,telegram,discord,whatsapp,feishu,twilio,wecom,wecom-bot,audio_mp3,embed-llama-metal"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # On workflow_dispatch for a specific tag, check out THAT tag —
          # otherwise we build main's HEAD but publish under the tag.
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Set build metadata
        run: |
          echo "OCTOS_GIT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "OCTOS_BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
          # Keep build-machine paths (home dir, cargo registry, checkout) out
          # of the shipped binaries' panic messages and file!() strings.
          home_dir="$HOME"; cargo_dir="${CARGO_HOME:-$HOME/.cargo}"; ws_dir="$GITHUB_WORKSPACE"
          if command -v cygpath >/dev/null 2>&1; then
            home_dir=$(cygpath -w "$home_dir"); cargo_dir=$(cygpath -w "$cargo_dir"); ws_dir=$(cygpath -w "$ws_dir")
          fi
          echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }--remap-path-prefix=${home_dir}=~ --remap-path-prefix=${cargo_dir}=/cargo --remap-path-prefix=${ws_dir}=." >> "$GITHUB_ENV"

      - name: Build dashboard
        run: |
          # One command per line so `set -e` aborts on ANY failure — a chained
          # `&&` can let an early failure slip and publish a binary missing the
          # embedded /admin or /app SPA.
          cd dashboard
          npm ci
          npm run build
          cd ..
          git submodule update --init octos-web
          bash scripts/build-web-app.sh
          bash scripts/build-swarm-app.sh

      - name: Build
        run: |
          cargo build --release -p octos-cli --features ${{ env.FEATURES }}
          cargo build --release -p octos-sandbox
          cargo build --release ${{ env.SKILL_CRATES }}

      - name: Bundle
        shell: bash
        run: ./scripts/bundle-release.sh octos-bundle-aarch64-apple-darwin.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-arm
          # Fail loudly when the bundle or its sidecar is missing instead of
          # letting verify-release fail 3 jobs later with a cryptic gap.
          if-no-files-found: error
          path: |
            octos-bundle-aarch64-apple-darwin.tar.gz
            octos-bundle-aarch64-apple-darwin.tar.gz.sha256

  build-linux-x86:
    needs: check-version
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux-x86'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # On workflow_dispatch for a specific tag, check out THAT tag —
          # otherwise we build main's HEAD but publish under the tag.
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Set build metadata
        run: |
          echo "OCTOS_GIT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "OCTOS_BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
          # Keep build-machine paths (home dir, cargo registry, checkout) out
          # of the shipped binaries' panic messages and file!() strings.
          home_dir="$HOME"; cargo_dir="${CARGO_HOME:-$HOME/.cargo}"; ws_dir="$GITHUB_WORKSPACE"
          if command -v cygpath >/dev/null 2>&1; then
            home_dir=$(cygpath -w "$home_dir"); cargo_dir=$(cygpath -w "$cargo_dir"); ws_dir=$(cygpath -w "$ws_dir")
          fi
          echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }--remap-path-prefix=${home_dir}=~ --remap-path-prefix=${cargo_dir}=/cargo --remap-path-prefix=${ws_dir}=." >> "$GITHUB_ENV"

      - name: Build dashboard
        run: |
          # One command per line so `set -e` aborts on ANY failure — a chained
          # `&&` can let an early failure slip and publish a binary missing the
          # embedded /admin or /app SPA.
          cd dashboard
          npm ci
          npm run build
          cd ..
          git submodule update --init octos-web
          bash scripts/build-web-app.sh
          bash scripts/build-swarm-app.sh

      - name: Build
        run: |
          cargo build --release -p octos-cli --features ${{ env.FEATURES }}
          cargo build --release -p octos-sandbox
          cargo build --release ${{ env.SKILL_CRATES }}

      - name: Bundle
        shell: bash
        run: ./scripts/bundle-release.sh octos-bundle-x86_64-unknown-linux-gnu.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-x86
          if-no-files-found: error
          path: |
            octos-bundle-x86_64-unknown-linux-gnu.tar.gz
            octos-bundle-x86_64-unknown-linux-gnu.tar.gz.sha256

  build-linux-arm:
    needs: check-version
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux-arm'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # On workflow_dispatch for a specific tag, check out THAT tag —
          # otherwise we build main's HEAD but publish under the tag.
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: arm64-release

      - name: Set build metadata
        run: |
          echo "OCTOS_GIT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "OCTOS_BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
          # Keep build-machine paths (home dir, cargo registry, checkout) out
          # of the shipped binaries' panic messages and file!() strings.
          home_dir="$HOME"; cargo_dir="${CARGO_HOME:-$HOME/.cargo}"; ws_dir="$GITHUB_WORKSPACE"
          if command -v cygpath >/dev/null 2>&1; then
            home_dir=$(cygpath -w "$home_dir"); cargo_dir=$(cygpath -w "$cargo_dir"); ws_dir=$(cygpath -w "$ws_dir")
          fi
          echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }--remap-path-prefix=${home_dir}=~ --remap-path-prefix=${cargo_dir}=/cargo --remap-path-prefix=${ws_dir}=." >> "$GITHUB_ENV"

      - name: Build dashboard
        run: |
          # One command per line so `set -e` aborts on ANY failure — a chained
          # `&&` can let an early failure slip and publish a binary missing the
          # embedded /admin or /app SPA.
          cd dashboard
          npm ci
          npm run build
          cd ..
          git submodule update --init octos-web
          bash scripts/build-web-app.sh
          bash scripts/build-swarm-app.sh

      - name: Build
        run: |
          cargo build --release -p octos-cli --features ${{ env.FEATURES }}
          cargo build --release -p octos-sandbox
          cargo build --release ${{ env.SKILL_CRATES }}

      - name: Bundle
        shell: bash
        run: ./scripts/bundle-release.sh octos-bundle-aarch64-unknown-linux-gnu.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-arm
          if-no-files-found: error
          path: |
            octos-bundle-aarch64-unknown-linux-gnu.tar.gz
            octos-bundle-aarch64-unknown-linux-gnu.tar.gz.sha256

  build-windows:
    needs: check-version
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # On workflow_dispatch for a specific tag, check out THAT tag —
          # otherwise we build main's HEAD but publish under the tag.
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: windows-release

      - name: Set build metadata
        shell: bash
        run: |
          echo "OCTOS_GIT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "OCTOS_BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
          # Keep build-machine paths (home dir, cargo registry, checkout) out
          # of the shipped binaries' panic messages and file!() strings.
          home_dir="$HOME"; cargo_dir="${CARGO_HOME:-$HOME/.cargo}"; ws_dir="$GITHUB_WORKSPACE"
          if command -v cygpath >/dev/null 2>&1; then
            home_dir=$(cygpath -w "$home_dir"); cargo_dir=$(cygpath -w "$cargo_dir"); ws_dir=$(cygpath -w "$ws_dir")
          fi
          echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }--remap-path-prefix=${home_dir}=~ --remap-path-prefix=${cargo_dir}=/cargo --remap-path-prefix=${ws_dir}=." >> "$GITHUB_ENV"

      - name: Build dashboard
        shell: bash
        run: |
          # One command per line so `set -e` aborts on ANY failure — a chained
          # `&&` can let an early failure slip and publish a binary missing the
          # embedded /admin or /app SPA.
          cd dashboard
          npm ci
          npm run build
          cd ..
          git submodule update --init octos-web
          bash scripts/build-web-app.sh
          bash scripts/build-swarm-app.sh

      - name: Build
        run: |
          cargo build --release -p octos-cli --features ${{ env.FEATURES }}
          cargo build --release -p octos-sandbox
          cargo build --release ${{ env.SKILL_CRATES }}

      - name: Bundle
        shell: bash
        run: ./scripts/bundle-release.sh octos-bundle-x86_64-pc-windows-msvc.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows
          if-no-files-found: error
          path: |
            octos-bundle-x86_64-pc-windows-msvc.zip
            octos-bundle-x86_64-pc-windows-msvc.zip.sha256

  # TODO: uncomment after Dockerfile is fixed
  # build-docker:
  #   runs-on: ubuntu-latest
  #   permissions:
  #     contents: read
  #     packages: write
  #   steps:
  #     - uses: actions/checkout@v6
  #
  #     - uses: docker/setup-qemu-action@v3
  #
  #     - uses: docker/setup-buildx-action@v3

  #       with:
  #         registry: ghcr.io
  #         username: ${{ github.actor }}
  #         password: ${{ secrets.GITHUB_TOKEN }}
  #
  #     - name: Extract version
  #       id: meta
  #       run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
  #
  #     - uses: docker/build-push-action@v6
  #       with:
  #         context: .
  #         platforms: linux/amd64,linux/arm64
  #         push: true
  #         tags: |
  #           ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
  #           ghcr.io/${{ github.repository }}:latest
  #         cache-from: type=gha
  #         cache-to: type=gha,mode=max

  publish:
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || inputs.tag != '') }}
    needs: [build-macos-arm, build-linux-x86, build-linux-arm, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: cargo install git-cliff --locked

      - name: Generate release notes
        run: git-cliff --latest --strip header -o RELEASE_NOTES.md

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          # Copy whichever platform bundles were built
          find artifacts -name 'octos-bundle-*' -exec cp {} release-assets/ \;
          # Always include install scripts
          cp scripts/install.sh scripts/install.ps1 scripts/deploy.ps1 scripts/octos-doctor.sh release-assets/
          echo "Assets to upload:"
          ls -la release-assets/

      - name: Detect pre-release
        id: prerelease
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if echo "$TAG" | grep -qE '[-](rc|alpha|beta|dev|preview|test|macos|linux|win)'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          files: release-assets/*
          body_path: RELEASE_NOTES.md

  verify-release:
    name: Verify GitHub release assets
    needs: publish
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || inputs.tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Verify complete release and readable archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          actual=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          expected='octos-bundle-aarch64-apple-darwin.tar.gz
          octos-bundle-aarch64-unknown-linux-gnu.tar.gz
          octos-bundle-x86_64-unknown-linux-gnu.tar.gz
          octos-bundle-x86_64-pc-windows-msvc.zip
          install.sh
          install.ps1
          deploy.ps1
          octos-doctor.sh'
          while IFS= read -r asset; do
            asset=$(echo "$asset" | xargs)
            [ -z "$asset" ] && continue
            echo "$actual" | grep -Fx "$asset" >/dev/null \
              || { echo "::error::release $TAG is missing $asset"; exit 1; }
          done <<< "$expected"

          mkdir verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'octos-bundle-x86_64-unknown-linux-gnu.tar.gz' --dir verify
          tar -tzf verify/octos-bundle-x86_64-unknown-linux-gnu.tar.gz >/dev/null

  package-publishers:
    name: Publish npm and Homebrew packages
    needs: verify-release
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || inputs.tag != '') }}
    uses: ./.github/workflows/publish-packages.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit

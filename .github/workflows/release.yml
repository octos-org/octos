name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (all = full release)'
        required: true
        type: choice
        default: all
        options: [all, macos-arm, linux-x86, linux-arm, windows, docker]
      tag:
        description: 'Tag to release (e.g. v0.1.2-rc5). Required for publish.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_VERSION: "1.97.1"
  FEATURES: "api,telegram,discord,whatsapp,feishu,twilio,wecom,wecom-bot,audio_mp3"
  SKILL_CRATES: "-p news_fetch -p deep-search -p deep-crawl -p send-email -p account-manager -p voice -p clock -p weather -p smart-home"

jobs:
  check-version:
    name: Verify tag matches workspace version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Compare release tag and Cargo workspace version
        if: github.event_name == 'push' || inputs.tag != ''
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match workspace version v$version"
            exit 1
          fi

  build-macos-arm:
    needs: check-version
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos-arm'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          # On workflow_dispatch for a specific tag, check out THAT tag —
          # otherwise we build main's HEAD but publish under the tag.
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2

      - name: Set build metadata
        run: |
          echo "OCTOS_GIT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "OCTOS_BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Build dashboard
        run: |
          # One command per line so `set -e` aborts on ANY failure — a chained
          # `&&` can let an early failure slip and publish a binary missing the
          # embedded /admin or /app SPA.
          cd dashboard
          npm ci
          npm run build
          cd ..
          git submodule update --init octos-web
          bash scripts/build-web-app.sh
          bash scripts/build-swarm-app.sh

      - name: Build
        run: |
          cargo build --release -p octos-cli --features ${{ env.FEATURES }}
          cargo build --release -p octos-sandbox
          cargo build --release ${{ env.SKILL_CRATES }}

      - name: Bundle
        shell: bash
        run: ./scripts/bundle-release.sh octos-bundle-aarch64-apple-darwin.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm
          path: octos-bundle-aarch64-apple-darwin.tar.gz

  build-linux-x86:
    needs: check-version
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux-x86'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # On workflow_dispatch for a specific tag, check out THAT tag —
          # otherwise we build main's HEAD but publish under the tag.
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2

      - name: Set build metadata
        run: |
          echo "OCTOS_GIT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "OCTOS_BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Build dashboard
        run: |
          # One command per line so `set -e` aborts on ANY failure — a chained
          # `&&` can let an early failure slip and publish a binary missing the
          # embedded /admin or /app SPA.
          cd dashboard
          npm ci
          npm run build
          cd ..
          git submodule update --init octos-web
          bash scripts/build-web-app.sh
          bash scripts/build-swarm-app.sh

      - name: Build
        run: |
          cargo build --release -p octos-cli --features ${{ env.FEATURES }}
          cargo build --release -p octos-sandbox
          cargo build --release ${{ env.SKILL_CRATES }}

      - name: Bundle
        shell: bash
        run: ./scripts/bundle-release.sh octos-bundle-x86_64-unknown-linux-gnu.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86
          path: octos-bundle-x86_64-unknown-linux-gnu.tar.gz

  build-linux-arm:
    needs: check-version
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux-arm'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          # On workflow_dispatch for a specific tag, check out THAT tag —
          # otherwise we build main's HEAD but publish under the tag.
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: arm64-release

      - name: Set build metadata
        run: |
          echo "OCTOS_GIT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "OCTOS_BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Build dashboard
        run: |
          # One command per line so `set -e` aborts on ANY failure — a chained
          # `&&` can let an early failure slip and publish a binary missing the
          # embedded /admin or /app SPA.
          cd dashboard
          npm ci
          npm run build
          cd ..
          git submodule update --init octos-web
          bash scripts/build-web-app.sh
          bash scripts/build-swarm-app.sh

      - name: Build
        run: |
          cargo build --release -p octos-cli --features ${{ env.FEATURES }}
          cargo build --release -p octos-sandbox
          cargo build --release ${{ env.SKILL_CRATES }}

      - name: Bundle
        shell: bash
        run: ./scripts/bundle-release.sh octos-bundle-aarch64-unknown-linux-gnu.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: linux-arm
          path: octos-bundle-aarch64-unknown-linux-gnu.tar.gz

  build-windows:
    needs: check-version
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # On workflow_dispatch for a specific tag, check out THAT tag —
          # otherwise we build main's HEAD but publish under the tag.
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release

      - name: Set build metadata
        shell: bash
        run: |
          echo "OCTOS_GIT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "OCTOS_BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Build dashboard
        shell: bash
        run: |
          # One command per line so `set -e` aborts on ANY failure — a chained
          # `&&` can let an early failure slip and publish a binary missing the
          # embedded /admin or /app SPA.
          cd dashboard
          npm ci
          npm run build
          cd ..
          git submodule update --init octos-web
          bash scripts/build-web-app.sh
          bash scripts/build-swarm-app.sh

      - name: Build
        run: |
          cargo build --release -p octos-cli --features ${{ env.FEATURES }}
          cargo build --release -p octos-sandbox
          cargo build --release ${{ env.SKILL_CRATES }}

      - name: Bundle
        shell: bash
        run: ./scripts/bundle-release.sh octos-bundle-x86_64-pc-windows-msvc.zip

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: octos-bundle-x86_64-pc-windows-msvc.zip

  # TODO: uncomment after Dockerfile is fixed
  # build-docker:
  #   runs-on: ubuntu-latest

name: Nightly Regression

# Broad, slower coverage lives here instead of extending every pull request.
# A scheduled failure opens or refreshes one actionable issue; the next green
# schedule closes it. Changes to this workflow validate themselves immediately.
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nightly.yml"

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  issues: write

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  RUST_VERSION: "1.97.1"
  FEATURES: "api,telegram,discord,dingtalk,whatsapp,feishu,twilio,wecom,wecom-bot,audio_mp3"

jobs:
  check-arm:
    name: ARM64 workspace tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      # The former main-branch ARM job repeatedly exhausted the hosted disk.
      # Remove large preinstalled SDKs before compiling the workspace.
      - name: Free runner disk
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-arm64
          save-if: false
      - name: Check the all-feature CLI surface
        run: cargo check -p octos-cli --features "$FEATURES" --locked
      - name: Test the workspace
        run: cargo test --workspace --locked

  check-windows:
    name: Windows workspace tests
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-windows
          save-if: false
      - name: Check the all-feature CLI surface
        run: cargo check -p octos-cli --features "${{ env.FEATURES }}" --locked
      - name: Test the workspace
        run: cargo test --workspace --locked

  protocol-e2e:
    name: AppUI protocol fixture E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-protocol-e2e
          save-if: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Build dashboard and server
        run: |
          ./scripts/build-dashboard.sh
          cargo build --release -p octos-cli --features "$FEATURES" --locked
      - name: Install browser test dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start deterministic protocol fixture
        run: |
          set -euo pipefail
          echo '{"allow_admin_shell": true}' > /tmp/octos-nightly-serve.json
          OCTOS_M9_PROTOCOL_FIXTURES=1 \
          OPENAI_API_KEY=fixture-key-not-a-secret \
          OCTOS_AUTH_TOKEN=ci-test-token \
            ./target/release/octos serve --port 3000 \
              --config /tmp/octos-nightly-serve.json \
              --provider openai --model gpt-4o --no-retry \
              > server.log 2>&1 &
          echo $! > server.pid
          for attempt in $(seq 1 45); do
            curl -sf http://localhost:3000/health >/dev/null && exit 0
            echo "attempt $attempt/45: waiting for octos serve"
            sleep 1
          done
          echo "::error::octos serve did not become healthy"
          cat server.log
          exit 1
      - name: Run deterministic protocol suite
        working-directory: e2e
        env:
          OCTOS_TEST_URL: http://localhost:3000
          OCTOS_AUTH_TOKEN: ci-test-token
          OCTOS_PROFILE: _main
        run: >-
          npx playwright test --reporter=line
          tests/m9-protocol-*.spec.ts
          tests/web-client.spec.ts
      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then kill "$(cat server.pid)" 2>/dev/null || true; fi
      - name: Upload protocol evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-protocol-evidence
          path: |
            server.log
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  regression-issue:
    name: Reconcile nightly regression issue
    needs: [check-arm, check-windows, protocol-e2e]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RESULTS: ${{ toJSON(needs) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ISSUE_TITLE: "[nightly] Regression detected"
    steps:
      - name: Open, refresh, or close the regression issue
        run: |
          set -euo pipefail
          failed=$(echo "$RESULTS" | jq -r \
            'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "- `\(.key)`: **\(.value.result)**"')
          gh label create nightly-regression \
            --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "Failure in the scheduled regression suite" --force
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --label nightly-regression --search '"[nightly] Regression detected" in:title' \
            --json number --jq '.[0].number // empty')

          if [ -n "$failed" ]; then
            body=$(printf 'Scheduled nightly regression failed.\n\n%s\n\n[Open the run](%s)\n\nReproduce with the commands shown in .github/workflows/nightly.yml.' "$failed" "$RUN_URL")
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" \
                --label nightly-regression --body "$body"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" \
              --comment "The scheduled nightly is green again: $RUN_URL"
          else
            echo "Nightly is green; no open regression issue."
          fi

name: Cleanup stale branches

# Weekly, delete remote branches whose changes are provably already in main
# (ancestor of main, or patch-equivalent — squash/rebase-merged). This is the
# automated half of BRANCH_LIFECYCLE.md. It never touches protected patterns,
# release/hotfix branches, or branches with an open PR.
#
# The deletion is recoverable: branch-cleanup.sh writes a SHA manifest and a
# self-contained git bundle, uploaded as a 90-day artifact.

on:
  schedule:
    - cron: '17 4 * * 0'   # Sundays 04:17 UTC
  workflow_dispatch:
    inputs:
      apply:
        description: "Delete (unchecked = dry-run)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-stale-branches
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete merged branches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch every branch
        run: git fetch --prune --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: List open PR head branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --state open --limit 1000 \
            --json headRefName --jq '.[].headRefName' > "$RUNNER_TEMP/open-prs.txt"

      - name: Run cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apply=""
          if [ "${{ github.event_name }}" = "schedule" ] \
             || [ "${{ inputs.apply }}" = "true" ]; then
            apply="--apply"
          fi
          scripts/branch-cleanup.sh \
            --base origin/main \
            --open-pr-file "$RUNNER_TEMP/open-prs.txt" \
            --logdir "$RUNNER_TEMP/branch-cleanup" \
            $apply

      - name: Upload the deletion log and recovery bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/branch-cleanup/
          if-no-files-found: ignore
          retention-days: 90

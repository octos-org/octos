name: Host-managed agent confinement

on:
  push:
    branches: [host-managed-ifc]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-managed-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  confinement:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # GitHub's disposable Ubuntu runner restricts unprivileged userns via
          # AppArmor. Enable the kernel feature required by this test fixture;
          # production launchers fail closed when the host disables it.
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Run actual kernel escape probes
        run: cargo test -p octos-sandbox --test host_managed --locked
      - name: Build actual host-managed worker
        run: cargo build -p octos-cli --no-default-features --locked
      - name: Run confined Octos handshake and memory session
        run: OCTOS_HOST_MANAGED_BINARY="$PWD/target/debug/octos" cargo test -p octos-sandbox --test host_managed --locked

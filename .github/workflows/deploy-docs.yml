name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'book-zh/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history: the book-zh parity lint compares per-chapter last-touch
      # commits between book/ and book-zh/ (#2453). An en-only change holds
      # the deploy on purpose: neither language's site updates until the zh
      # side lands.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Lint book-zh parity
        run: python3 scripts/lint-book-zh-parity.py

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2
        with:
          mdbook-version: '0.5.4'

      - name: Build English documentation
        run: cd book && mdbook build

      - name: Build Chinese documentation
        run: cd book-zh && mdbook build

      - name: Merge EN + ZH into single site
        run: |
          mkdir -p book/public/zh
          cp -r book-zh/public/* book/public/zh/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: book/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

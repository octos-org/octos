[package]
name = "octos-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CLI interface for octos"

[[bin]]
name = "octos"
path = "src/main.rs"

[dependencies]
octos-core = { workspace = true }
# `github` feature on for Stage 2: enables the shared GitHub Releases client so
# `octos update --check` + `octos doctor`'s Network category can reach the public
# Releases API. Self-update mutation stays on the existing `updater.rs` (Stage 3).
octos-diagnostics = { workspace = true, features = ["github"] }
octos-agent = { workspace = true }
octos-memory = { workspace = true }
octos-llm = { workspace = true }
octos-bus = { workspace = true }
octos-pipeline = { workspace = true }
octos-swarm = { workspace = true }
# RFC-2 (issue #1291): `octos skills install` runs the manifest schema
# validator at install time so the operator sees the error before the
# agent loop ever loads the broken manifest. The validator lives in
# `octos-plugin::manifest_validator` and is reached through the
# top-level re-exports.
octos-plugin = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
colored = { workspace = true }
chrono = { workspace = true }
iana-time-zone = { workspace = true }
tokio = { workspace = true }
eyre = { workspace = true }
uuid = { workspace = true }
color-eyre = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
rustyline = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
fs2 = { workspace = true }
subtle = { workspace = true, optional = true }
getrandom = "0.2"
constant_time_eq = "0.3"
# Issue #1010 — `extract_token` must percent-decode the `token=` query
# param so a token containing `!`, `+`, `/`, `=`, `:` matches the value
# stored on `AppState.auth_token` / the OTP session store. The
# `Authorization: Bearer …` header path takes the bytes literally —
# HTTP headers are NOT percent-encoded — so the WS path uses RFC 3986
# percent-decode-only semantics (leaves `+` literal) to stay consistent
# with REST.
percent-encoding = "2"
open = { workspace = true }
zip = { workspace = true }
quick-xml = { workspace = true }
image = { workspace = true }
regex = { workspace = true }
tempfile = { workspace = true }
base64 = { workspace = true }
# #1057: `onboarding/workspace_probe` parses `workspace_policy.toml` to
# surface presence + parse errors during TUI onboarding. The probe re-uses
# `octos_agent::workspace_policy::WorkspacePolicy` as the canonical schema
# and only needs the `toml` deserializer entry point here.
toml = { workspace = true }
# `octos acp` speaks the Agent Client Protocol (Zed editor <-> agent standard)
# over stdio. The official Rust SDK provides the JSON-RPC framing, the schema
# types (initialize/session-new/prompt/cancel + session/update notifications),
# and the connection runtime; `acp.rs` implements the agent side on top of the
# existing octos agent loop. Pinned to the published 1.2.0 line.
agent-client-protocol = "1.2.0"
keyring = { workspace = true }
flate2 = { workspace = true }
qrcode = { workspace = true }
chacha20poly1305 = { workspace = true }
argon2 = { workspace = true }
tar = { workspace = true }
# Optional deps gated by feature flags (api, admin-bot)
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true, features = ["limit"] }
# CancellationToken shared with the rmcp streamable-HTTP service so Ctrl+C tears
# down live SSE sessions instead of blocking graceful shutdown.
tokio-util = { version = "0.7", optional = true }
futures = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
rust-embed = { workspace = true, optional = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true, optional = true }
lettre = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
teloxide = { workspace = true, optional = true }
sysinfo = { version = "0.34", optional = true }
redb.workspace = true

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW for the symlink-safe preview file serve in
# `src/api/preview.rs`. Pinned by issue #996 BLOCKING #1: previously
# `tokio::fs::read` followed symlinks between the canonical-descendant
# check and the read, opening a TOCTOU window.
libc = { workspace = true }
# `rustix::fs::openat` for the component-by-component path walk in
# `src/api/preview.rs::open_no_follow_walk`. Codex round-2 BLOCKING #1
# (issue #996): the previous `symlink_metadata`-then-`open` ancestor
# walk left a multi-syscall TOCTOU window — an attacker could swap
# any ancestor for a symlink between the stat and the open. Rustix's
# safe `openat` wrapper (workspace-wide `deny(unsafe_code)` rules out
# raw `libc::openat`) anchors each step to a parent fd so the
# relationship survives mid-walk swaps.
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[features]
default = []
# `matrix` is pulled in unconditionally: the `/api/my/profile/matrix/*`
# handlers and the admin dashboard's Matrix invite UI reference matrix-only
# types (e.g. `octos_bus::MatrixInviteStore`), so the API cannot compile
# without it.
api = ["dep:axum", "dep:tower-http", "dep:tokio-util", "dep:futures", "dep:tokio-tungstenite", "dep:rustls", "dep:rustls-native-certs", "dep:rust-embed", "dep:metrics-exporter-prometheus", "dep:lettre", "dep:rand", "dep:sysinfo", "dep:subtle", "octos-bus/api", "matrix"]
admin-bot = ["dep:teloxide", "dep:futures", "api"]
telegram = ["octos-bus/telegram"]
discord = ["octos-bus/discord"]
dingtalk = ["octos-bus/dingtalk"]
slack = ["octos-bus/slack"]
whatsapp = ["octos-bus/whatsapp"]
email = ["octos-bus/email"]
feishu = ["octos-bus/feishu"]
twilio = ["octos-bus/twilio"]
wecom = ["octos-bus/wecom"]
line = ["octos-bus/line"]
matrix = ["octos-bus/matrix"]
wecom-bot = ["octos-bus/wecom-bot"]
qq-bot = ["octos-bus/qq-bot"]
wechat = ["octos-bus/wechat"]
git = ["octos-agent/git"]
ast = ["octos-agent/ast"]
# Mp3 decode for the AudioNonSilent workspace-contract validator (.mp3 files).
# Without it, validators on .mp3 artifacts return "feature not enabled" — see
# `crates/octos-agent/src/validators.rs`. Fleet builds that ship the podcast
# / fm_tts skills should enable this so the contract layer accepts the mp3
# outputs they produce.
audio_mp3 = ["octos-agent/audio_mp3"]

[lints]
workspace = true

[dev-dependencies]
tokio-test = { workspace = true }
tower = { workspace = true }
axum = { workspace = true }
# Wave-4 B3.4 — enable `test-utils` for octos-llm so the gateway's
# failover-surfacing tests can call `publish_failover_for_subscribers`.
# Production builds don't see this; only `cargo test -p octos-cli`.
octos-llm = { workspace = true, features = ["test-utils"] }
tokio-tungstenite.workspace = true

[[test]]
name = "build_output_dir_validation"
path = "tests/build_output_dir_validation.rs"
required-features = ["api"]

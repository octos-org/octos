[package]
name = "octos-research"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Research building blocks for octos search tools: free news/search providers, structured items, lang/since/domain filters, robots.txt, main-text extraction, and a clean-room metasearch with sandboxed OctoScript engines"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
regex = { workspace = true }
quick-xml = { workspace = true }
tokio = { version = "1", features = ["sync", "time", "net"] }
# SSRF-safe HTTP for the shared reader (`fetch` feature) and the metasearch
# fetcher (`http`). gzip: Stack Exchange compresses every response.
reqwest = { workspace = true, optional = true, features = ["gzip"] }
# Readability-style main-text + metadata extraction (MIT, a port of Mozilla
# readability.js). Optional so `deep-crawl` can use the robots.txt and URL
# helpers without pulling in an HTML parser it does not need.
dom_smoothie = { version = "0.18", optional = true }
# Metasearch: engines are sandboxed OctoScript scripts (MIT, OctoSense-org),
# pinned to one reviewed revision. Only the bounded core runtime is used (the
# host installs its own `net`/`markup` modules); makepad-script is the VM it
# re-exports, pinned to the same revision Octoscript uses, for the native
# method macros.
octoscript-core = { git = "https://github.com/OctoSense-org/Octoscript.git", rev = "e152f8bc1fd7dae1ce51993cab1c5fcb0fdc8b23", optional = true }
makepad-script = { git = "https://github.com/OctoSense-org/makepad.git", rev = "6e5898fecbe5931c16fb7b1e54357104dd54e825", optional = true }
sha2 = { workspace = true, optional = true }
# HTML selection for results-page engines (`markup.select`) and redirect
# unwrapping (`markup.unwrap`).
scraper = { version = "0.22", optional = true }
base64 = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
# The person's browser (`browser` feature): results pages that need a real
# browser, loaded in a plain Chrome over CDP.
chromiumoxide = { workspace = true, optional = true }

# `impersonate` (not on Windows): the `legacy_mobile` client for results
# pages that only answer a browser-like client (Google's page for simple
# phones), as SearXNG does. BoringSSL-based; building it needs cmake.
[target.'cfg(not(windows))'.dependencies]
wreq = { version = "=6.0.0-rc.31", optional = true, features = ["gzip", "brotli", "deflate"] }
wreq-util = { version = "=3.0.0-rc.14", optional = true }

[features]
default = ["extract", "fetch", "metasearch"]
extract = ["dep:dom_smoothie"]
# SSRF checks + DNS-pinned GET (`net`), and with `extract` the polite
# `reader`. deep-crawl uses `fetch` without `extract`.
fetch = ["dep:reqwest"]
# `fetch` provides the private-address checks applied to engine hosts.
metasearch = [
    "fetch",
    "dep:octoscript-core",
    "dep:makepad-script",
    "dep:sha2",
    "dep:scraper",
    "dep:base64",
    "dep:futures",
    "dep:tracing",
]
# `ReqwestFetch`: a ready-made metasearch fetcher over reqwest.
http = ["metasearch", "fetch"]
# `PersonBrowser` / `PersonBrowserFetch`: render requests in the person's
# browser (octos-owned Chrome profile), challenges shown to the person.
browser = ["http", "dep:chromiumoxide"]
# `ImpersonatingFetch`: engines whose manifest names a `client` profile are
# fetched with it (see `metasearch::impersonate`). No effect on Windows.
impersonate = ["http", "dep:wreq", "dep:wreq-util"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }

[[example]]
name = "record_engine_fixtures"
required-features = ["http"]

[[example]]
name = "metasearch_query"
required-features = ["http"]

[[example]]
name = "browser_page"
required-features = ["browser"]

[[test]]
name = "engine_fixtures"
required-features = ["metasearch"]

[[test]]
name = "engines_live"
required-features = ["http"]

[lints]
workspace = true

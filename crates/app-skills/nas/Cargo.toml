[package]
name = "nas"
version = "1.0.0"
edition = "2021"
description = "Browse, read and search files on a Synology NAS via the FileStation Web API"
authors = ["octos"]

[[bin]]
name = "nas_bridge"
path = "src/main.rs"

[lib]
name = "nas"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"], default-features = false }

[package.metadata.release]
release = false

[package]
name = "home-assistant"
version = "1.0.0"
edition = "2021"
description = "Control and query a Home Assistant smart home via its REST API"
authors = ["octos"]

[[bin]]
name = "ha_bridge"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"], default-features = false }

[package.metadata.release]
release = false

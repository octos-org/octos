# cbindgen config for the octos-ffi C header.
#
# Regenerate the committed header with:
#   cbindgen --config crates/octos-ffi/cbindgen.toml \
#            --crate octos-ffi \
#            --output crates/octos-ffi/include/octos.h
language = "C"
pragma_once = true
include_guard = "OCTOS_FFI_H"
cpp_compat = true
style = "type"
documentation = true
documentation_style = "c99"
autogen_warning = "/* Generated by cbindgen. DO NOT EDIT. Regenerate with the command in crates/octos-ffi/cbindgen.toml. */"
header = """
/*
 * octos-ffi C API.
 *
 * OWNERSHIP & SAFETY CONTRACT:
 *  - An OctosRuntime* is NOT thread-safe. Serialize all calls on a handle.
 *    Never use a handle after octos_runtime_free(); never free it twice or
 *    concurrently with any other call on the same handle. Free it from a plain
 *    (non-async) thread.
 *  - Strings returned by octos_run_task()/octos_embed() or
 *    octos_take_last_partial_result() are owned by YOU and
 *    must be freed, UNMODIFIED, with octos_string_free() -- never free(3),
 *    never twice, and do not alter the bytes or NUL terminator before freeing.
 *  - const char* from octos_last_error()/octos_version() must NOT be freed.
 *    octos_last_error() is thread-local and valid only until the next FFI call
 *    on the same thread.
 */"""

[parse]
# Only parse this crate's own items; the C surface is self-contained.
parse_deps = false

[export]
# `OctosRuntime` has no #[repr(C)] and only private fields, so cbindgen emits it
# as an opaque forward declaration — exactly the intended handle type.
item_types = ["functions", "structs", "opaque"]

[fn]
sort_by = "None"

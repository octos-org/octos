[package]
name = "octos-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Agent runtime, tool execution, and coordination for octos"

[dependencies]
octos-core = { workspace = true }
octos-bus = { workspace = true }
octos-memory = { workspace = true }
octos-llm = { workspace = true }
octos-plugin = { workspace = true }
# codex-execpolicy = { workspace = true }  # Enable when codex builds
# codex-file-search = { workspace = true }
# codex-linux-sandbox = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
eyre = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
glob = { workspace = true }
globset = { workspace = true }
which = { workspace = true }
regex = { workspace = true }
ignore = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
# MCP over the official rmcp SDK. Client: stdio + streamable-HTTP + OAuth 2.1.
# Server (`octos mcp-serve`): `server` + `transport-io` for the stdio handler.
rmcp = { version = "1.8", default-features = false, features = [
    "client",
    "server",
    "auth",
    "macros",
    "base64",
    "transport-async-rw",
    "transport-child-process",
    "transport-io",
    "transport-streamable-http-client-reqwest",
] }
oauth2 = "5"
# rmcp's `AuthClient` wraps a reqwest 0.13 client (rmcp's own reqwest major).
# Aliased so it coexists with octos's reqwest 0.12; cargo unifies both 0.13
# users to the same crate instance, so the type matches rmcp's expectations.
reqwest_rmcp = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls"] }
# Interactive OAuth login (`octos mcp login`): open the consent URL + catch the
# loopback redirect.
tiny_http = "0.12"
webbrowser = "1"
# Keyring for MCP OAuth token storage. The persistent platform backend is
# selected per-OS below (`[target.*]`); without one the crate falls back to a
# non-persistent in-memory mock, so login would silently lose tokens.
keyring = { workspace = true }
url = { workspace = true }
htmd = { workspace = true }
dirs = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
libc = { workspace = true }
gix = { workspace = true, optional = true }
similar = { workspace = true, optional = true }
tree-sitter = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
base64 = { workspace = true }
chromiumoxide = { workspace = true }
pdf-extract = { workspace = true }
tempfile = { workspace = true }
lettre = { workspace = true }
redb = { workspace = true }
hound = { workspace = true }
symphonia = { workspace = true, optional = true }

# Persistent keyring backend per OS for MCP OAuth token storage. Feature-unioned
# with the base `keyring` dep above; each is compiled only for its target.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

# Kernel keyutils (pure-Rust, no system libdbus) so it builds on stock CI/Linux.
# Session-scoped: tokens persist across octos invocations within a login session
# but not across reboot/logout (a Secret-Service backend would need system
# libdbus). Documented in the migration ADR.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["linux-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[features]
# `browser` is ON by default: it gates the headless-Chrome (CDP) search
# provider that `web_search` uses as a last-resort fallback (after every HTTP
# provider yields nothing). The underlying `chromiumoxide` dependency and the
# `browser` tool itself are always compiled; this feature only toggles the new
# CDP-backed `web_search` fallback so `--no-default-features` builds keep the
# pre-existing HTTP-only `web_search` behaviour byte-for-byte.
default = ["browser"]
browser = []
git = ["dep:gix", "dep:similar"]
ast = ["dep:tree-sitter", "dep:tree-sitter-rust", "dep:tree-sitter-python", "dep:tree-sitter-javascript", "dep:tree-sitter-typescript"]
# Enable MP3 decoding for the `AudioNonSilent` workspace-policy validator.
# WAV decoding is always-on via `hound`; MP3 pulls in `symphonia` which is
# heavier so we keep it opt-in for non-audio workspaces.
audio_mp3 = ["dep:symphonia"]

[lints]
workspace = true

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }

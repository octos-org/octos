<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title description">
<title id="title">Octos 内核架构</title>
<desc id="description">应用和 Agent 控制端通过 OUP 接入；原生宿主嵌入库。两条路径连接 Octos Harness 内核，使用状态、执行与协作能力。</desc>

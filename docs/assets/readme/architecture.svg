<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title description">
<title id="title">Octos kernel architecture</title>
<desc id="description">Applications and agent controllers use OUP; native hosts embed libraries. Both reach the Octos harness kernel and its state, execution, and coordination capabilities.</desc>
